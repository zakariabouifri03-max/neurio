[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novacut-ai-studio"
version = "0.1.0"
description = "Local-first, non-destructive desktop video editor"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "novacut/LICENSE" }
dependencies = ["PySide6>=6.6,<7.0"]

[project.optional-dependencies]
ai = ["Pillow>=10.0", "rembg>=2.0", "onnxruntime>=1.17", "demucs>=4.0"]
dev = ["pytest>=8.0,<10.0", "pyinstaller>=6.5,<7.0", "pyflakes>=3.2,<4.0"]

[project.scripts]
novacut = "novacut.app:main"

[tool.setuptools]
packages = ["novacut"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
