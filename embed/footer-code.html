<!-- ADZAK ART — كود التذييل (Footer Code) -->
<div id="adzak-sakura-storefront-app" dir="ltr"></div>
<script>
(function () {
  if (window.__ADZAK_STORE_BOOTED__) return;
  window.__ADZAK_STORE_BOOTED__ = true;

  if (!window.ADZAK_PAYPAL_CONFIG) {
    window.ADZAK_PAYPAL_CONFIG = {
      liveClientId: "",
      testCentMode: false,
      testCentAmount: 0.01,
      sdkClientId: "BAAcGe9lR0lGxAMuQ0ZpOVcmwiKxH46aVSQdEkgLBi-sVOzXJ80k3r2FGKiWo-7POW3Z3aZIcaYWIS7qNw",
      hostedButtonId: "J2PB3BSV3DCC8",
      singleDesignUrl: "https://www.paypal.com/ncp/payment/J2PB3BSV3DCC8",
      bundleUrl: "https://www.paypal.com/ncp/payment/J2PB3BSV3DCC8"
    };
  }
  if (!window.__ADZAK_PP_LOADING__ && window.location.protocol !== 'file:') {
    window.__ADZAK_PP_LOADING__ = true;
    var ps = document.createElement('script');
    ps.async = true;
    ps.onload = function () { if (window.__onPaypalSdkReady) window.__onPaypalSdkReady(); };
    ps.src = 'https://www.paypal.com/sdk/js?client-id=' + encodeURIComponent(window.ADZAK_PAYPAL_CONFIG.sdkClientId) + '&components=hosted-buttons&disable-funding=venmo&currency=USD';
    document.head.appendChild(ps);
  }

  var RAW_BASE = 'https://raw.githubusercontent.com/zakariabouifri03-max/neurio/arena/f2c0341b-neurio/embed';
  var CDN_BASE = 'https://cdn.jsdelivr.net/gh/zakariabouifri03-max/neurio@a62f8b5/embed';

  function loadBundleWithFallback() {
    return fetch(RAW_BASE + '/adzak-store-bundle.json')
      .then(function (r) {
        if (!r.ok) throw new Error('raw ' + r.status);
        return r.json();
      })
      .catch(function () {
        return fetch(CDN_BASE + '/adzak-store-bundle.json').then(function (r2) {
          if (!r2.ok) throw new Error('cdn ' + r2.status);
          return r2.json().then(function (b) {
            var swap = function (u) { return typeof u === 'string' ? u.replace(RAW_BASE, CDN_BASE) : u; };
            if (b.assets) {
              Object.keys(b.assets).forEach(function (k) { b.assets[k] = swap(b.assets[k]); });
            }
            if (b.vault) {
              Object.keys(b.vault).forEach(function (k) {
                b.vault[k] = Array.isArray(b.vault[k]) ? b.vault[k].map(swap) : [swap(b.vault[k])];
              });
            }
            return b;
          });
        });
      });
  }

  function mountStore() {
    var root = document.getElementById('adzak-sakura-storefront-app');
    if (!root) {
      root = document.createElement('div');
      root.id = 'adzak-sakura-storefront-app';
      root.setAttribute('dir', 'ltr');
    }
    if (document.body.firstChild !== root) {
      document.body.insertBefore(root, document.body.firstChild);
    }
    root.innerHTML = '<div style="min-height:60vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#e11d74;font-weight:700;background:#fff8fb;">&#127800; Loading ADZAK ART Store...</div>';

    loadBundleWithFallback()
      .then(function (bundle) {
        window.__ADZAK_ASSETS__ = bundle.assets || {};
        window.__ADZAK_LOCKED_VAULT__ = {};
        window.__ADZAK_VAULT_URLS__ = bundle.vault || {};

        if (!document.getElementById('adzak-sakura-css')) {
          var st = document.createElement('style');
          st.id = 'adzak-sakura-css';
          st.textContent = bundle.css || '';
          document.head.appendChild(st);
        }

        root.innerHTML = bundle.html || '';

        var appScript = document.createElement('script');
        appScript.textContent = bundle.js || '';
        document.body.appendChild(appScript);
      })
      .catch(function (err) {
        console.error('ADZAK Store load error:', err);
        root.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;color:#be123c;">Unable to load storefront bundle. Please refresh the page.</div>';
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mountStore);
  } else {
    mountStore();
  }
})();
</script>
