[package]
name = "nexus-video-studio"
version = "0.1.0"
description = "Offline-first video editing studio"
authors = ["NEXUS VIDEO STUDIO"]
edition = "2021"

[lib]
name = "nexus_video_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["tls"] }
