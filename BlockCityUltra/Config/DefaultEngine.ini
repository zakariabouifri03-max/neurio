GameName=BlockCityUltra

[/Script/Engine.RendererSettings]
; ── Core modern-renderer feature set ─────────────────────────────────────────
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=1
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.AntiAliasing=2
r.TemporalAA.Upsampling=True
r.TemporalAA.Quality=2

; Nanite: our merged/instanced voxel clusters are Nanite-compatible static
; meshes. Translucent & masked-2-sided foliage fall back (see Docs/05).
r.Nanite=1
r.Nanite.MaxPixelsPerEdge=0.5
r.Nanite.ViewMeshLODBias=-1

; Lumen GI + reflections (Software by default; Hardware RT enabled by preset)
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=1
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True

; Virtual Shadow Maps
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.MaxPhysicalPages=4096
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5

; Optional hardware ray tracing path (toggled by BCUGraphicsSubsystem presets)
r.RayTracing=False
r.RayTracing.EnableForProject=False
r.RayTracing.Shadows=True
r.RayTracing.Reflections=True
r.RayTracing.Geometry.InstancedStaticMeshes=True
r.RayTracing.Nanite.Mode=1

; Post / atmosphere / volumetrics
r.VolumetricFog=True
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=128
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=True
r.SkyAtmosphere.MultiScatteringLUT.HighQuality=True
r.DefaultFeature.LensFlare=True
r.BloomQuality=5
r.DepthOfFieldQuality=2
r.AmbientOcclusionMipLevelFactor=0.4
r.DistanceFieldShadowing=1
r.GenerateMeshDistanceFields=True
r.DynamicGI.UpdateEverything=True

; Texture streaming — 32 GB build target
r.TextureStreaming=True
r.Streaming.PoolSize=4096
r.Streaming.MaxTempMemoryAllowedInMB=512
r.Streaming.LimitPoolSizeToVRAM=True
r.Streaming.Boost=1.5

; Virtual textures (procedural material layering + landscape)
r.VirtualTextures=True
r.VirtualTexturedLightmaps=True
r.VT.PoolSizeScale=1.0

; Decals / tire marks / puddles
r.Decal.MaxCount=4096
r.Decal.StencilSizeThreshold=0.1

; Async compute + GPU stats
r.AsyncPipelineCompile=True
r.GTSyncType=0
r.OneFrameThreadLag=True

