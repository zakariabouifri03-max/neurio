;═══════════════════════════════════════════════════════════════════════════════
; BLOCK CITY ULTRA — DefaultScalability.ini
;
; FOUR shipping presets (group index → preset name):
;   0 = PERFORMANCE   (1080p, GTX 1660 / RX 6600 class, integrated fallbacks)
;   1 = BALANCED      (1080p high-refresh, RTX 3060 / RX 6700 class)
;   2 = QUALITY       (1440p, RTX 4060 Ti / RX 7700 XT class)
;   3 = ULTRA         (1440p/4K, RTX 5060+ class, hardware RT where supported)
;
; UBCUGraphicsSubsystem applies these at runtime (sg.ResolutionQuality,
; sg.ViewDistanceQuality, sg.AntiAliasingQuality, sg.ShadowQuality,
; sg.GlobalIlluminationQuality, sg.ReflectionQuality, sg.PostProcessQuality,
; sg.TextureQuality, sg.EffectsQuality, sg.FoliageQuality, sg.ShadingQuality)
; and then layers DLSS / Frame Generation / dynamic resolution on top.
;
; Per-category overrides live at the bottom so the settings menu can scale
; shadows / reflections / lighting / view distance / vegetation / traffic
; independently, exactly as the design doc requires.
;═══════════════════════════════════════════════════════════════════════════════

[ResolutionQuality@0]
; PERFORMANCE: render at 82% and upscale with TSR (or DLSS SR when available)
sg.ResolutionQuality=82
[ResolutionQuality@1]
sg.ResolutionQuality=92
[ResolutionQuality@2]
sg.ResolutionQuality=100
[ResolutionQuality@3]
sg.ResolutionQuality=100

