; BLOCK CITY ULTRA — DefaultInput.ini
; Legacy console bindings + axis mappings. All *gameplay* input is driven by
; Enhanced Input (IMC_OnFoot / IMC_Driving / IMC_UI) registered in
; UBCUPlayerController::SetupInputComponent(). Kept here for debug, console and
; for teams that prefer axis-based binding.
;═══════════════════════════════════════════════════════════════════════════════

