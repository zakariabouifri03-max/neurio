<!--
  ============================================================
  NEURIO · FOOTER CODE (Fourthwall)
  Shop settings → Edit HTML code → Footer code
  Then tick "Enable footer code" and Save.

  Size: ~9 KB (limit 30,000)
  Adds: 5-star reviews band, floating rating badge and
  AggregateRating structured data. Works on its own — the header
  snippet is optional.

  Edit the CONFIG object at the top of the script.
  ============================================================
-->

<style id="neurio-footer-style">
  .nf-band, .nf-band *, .nf-badge, .nf-badge * { box-sizing: border-box; }

  .nf-band {
    padding: 54px 20px 40px;
    background: #f5f6fb;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #0c1222;
    border-top: 1px solid rgba(15, 23, 42, 0.08);
  }
  .nf-inner { max-width: 1080px; margin: 0 auto; }

  .nf-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; flex-wrap: wrap; margin-bottom: 26px;
  }
  .nf-eyebrow {
    margin: 0 0 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    color: #5334e8;
  }
  .nf-inner h2 {
    margin: 0;
    font-size: clamp(24px, 3.6vw, 34px);
    line-height: 1.1; letter-spacing: -0.035em; font-weight: 600;
    color: #0c1222;
  }
  .nf-sub { margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: #566073; max-width: 52ch; }

  .nf-score { text-align: right; display: flex; flex-direction: column; gap: 2px; }
  .nf-score__num { font-size: 30px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; }
  .nf-stars { color: #e8a01f; letter-spacing: 2px; font-size: 13px; line-height: 1; }
  .nf-score__meta { font-size: 11px; color: #6b7688; }

  .nf-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }
  .nf-card {
    margin: 0;
    display: flex; flex-direction: column; gap: 12px;
    padding: 20px;
    background: #ffffff;
    border: 1px solid rgba(15, 23, 42, 0.09);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .nf-card:hover {
    transform: translateY(-3px);
    border-color: rgba(106, 76, 245, 0.28);
    box-shadow: 0 20px 34px -26px rgba(16, 24, 40, 0.35);
  }
  .nf-card blockquote {
    margin: 0;
    font-size: 14px; line-height: 1.6; letter-spacing: -0.01em; color: #2c3548;
  }
  .nf-card figcaption { display: flex; align-items: center; gap: 10px; margin-top: auto; }
  .nf-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center; flex: none;
    font-size: 11px; font-weight: 700; color: #0b1220;
    background: linear-gradient(140deg, #8b72ff, #22d3ee);
  }
  .nf-card figcaption span:last-child { display: flex; flex-direction: column; line-height: 1.3; }
  .nf-card strong { font-size: 13px; font-weight: 600; }
  .nf-card small { font-size: 11px; color: #6b7688; }

  .nf-perks {
    display: flex; flex-wrap: wrap; gap: 10px 22px;
    margin: 0; padding: 16px 0 0;
    list-style: none;
    border-top: 1px solid rgba(15, 23, 42, 0.08);
  }
  .nf-perks li {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: #4b556b;
  }
  .nf-perks svg { width: 14px; height: 14px; stroke: #0b8f6b; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .nf-badge {
    position: fixed; left: 18px; bottom: 18px; z-index: 9998;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px 9px 12px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 12px; line-height: 1.2; color: #34405a; text-decoration: none;
    background: rgba(255, 255, 255, 0.95);
    border: 1px solid rgba(15, 23, 42, 0.1);
    border-radius: 999px;
    box-shadow: 0 16px 36px -18px rgba(16, 24, 40, 0.45);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .nf-badge:hover { transform: translateY(-2px); box-shadow: 0 22px 40px -20px rgba(16, 24, 40, 0.5); }
  .nf-badge__num { font-size: 15px; font-weight: 700; color: #0c1222; letter-spacing: -0.02em; }
  .nf-badge small { display: block; color: #6b7688; font-size: 11px; margin-top: 2px; }
  .nf-badge__icon {
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center; flex: none;
    background: linear-gradient(140deg, #8b72ff, #22d3ee);
  }
  .nf-badge__icon svg { width: 14px; height: 14px; fill: #fff; }

  @media (max-width: 860px) {
    .nf-grid { grid-template-columns: 1fr; }
    .nf-score { text-align: left; }
    .nf-band { padding: 40px 16px 32px; }
  }
  @media (max-width: 640px) {
    .nf-badge { left: 10px; bottom: 10px; padding: 8px 12px 8px 10px; }
    .nf-badge small { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .nf-badge, .nf-card { transition: none; }
  }
</style>

<script>
(function () {
  "use strict";

  /* ------------------ CONFIG ------------------ */
  var CONFIG = {
    rating: "5.0",
    reviews: "3,200+",
    heading: "Rated 5.0 by 3,200+ customers",
    sub: "Instant delivery, lifetime updates and a 14-day guarantee on every order.",
    perks: ["Instant download", "Lifetime updates", "14-day guarantee"],
    quotes: [
      {
        text: "Love the designs. Everything is clean and looks really nice.",
        name: "Amine K.",
        role: "Product designer"
      },
      {
        text: "The designs are beautiful, exactly the style I like.",
        name: "Maya J.",
        role: "Freelance developer"
      },
      {
        text: "Really nice designs and easy to use. I’m happy with it.",
        name: "Sofia R.",
        role: "Studio founder"
      }
    ],
    showBadge: true,
    badgeLink: "#neurio-reviews",   // or a full URL
    schema: true               // AggregateRating structured data
  };

  function el(tag, className, html) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (html) node.innerHTML = html;
    return node;
  }

  function initials(name) {
    return name.split(/\s+/).map(function (part) { return part.charAt(0); }).join("").slice(0, 2).toUpperCase();
  }

  function buildBand() {
    var section = el("section", "nf-band");
    section.id = "neurio-reviews";
    section.setAttribute("aria-label", "Customer reviews and guarantees");

    var inner = el("div", "nf-inner");

    var head = el("div", "nf-head");
    var headCopy = el("div", null,
      '<p class="nf-eyebrow">Trusted by makers</p>' +
      '<h2>' + CONFIG.heading + '</h2>' +
      '<p class="nf-sub">' + CONFIG.sub + '</p>'
    );
    var score = el("div", "nf-score",
      '<span class="nf-score__num">' + CONFIG.rating + '</span>' +
      '<span class="nf-stars" aria-label="' + CONFIG.rating + ' out of 5 stars">★★★★★</span>' +
      '<span class="nf-score__meta">Verified buyers</span>'
    );
    head.appendChild(headCopy);
    head.appendChild(score);

    var grid = el("div", "nf-grid");
    CONFIG.quotes.forEach(function (q) {
      var card = el("figure", "nf-card");
      card.appendChild(el("div", "nf-stars", "★★★★★"));
      card.appendChild(el("blockquote", null, "“" + q.text + "”"));
      card.appendChild(el("figcaption", null,
        '<span class="nf-avatar" aria-hidden="true">' + initials(q.name) + '</span>' +
        '<span><strong>' + q.name + '</strong><small>' + q.role + '</small></span>'
      ));
      grid.appendChild(card);
    });

    var perks = el("ul", "nf-perks");
    CONFIG.perks.forEach(function (perk) {
      perks.appendChild(el("li", null,
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg>' + perk
      ));
    });

    inner.appendChild(head);
    inner.appendChild(grid);
    inner.appendChild(perks);
    section.appendChild(inner);
    return section;
  }

  function buildBadge() {
    var a = document.createElement("a");
    a.className = "nf-badge";
    a.href = CONFIG.badgeLink;
    a.setAttribute("aria-label", "Rated " + CONFIG.rating + " out of 5 by " + CONFIG.reviews + " customers");
    a.innerHTML =
      '<span class="nf-badge__icon" aria-hidden="true">' +
        '<svg viewBox="0 0 24 24"><path d="m12 2.6 2.9 6 6.6.9-4.8 4.6 1.2 6.5-5.9-3.2-5.9 3.2 1.2-6.5L2.5 9.5l6.6-.9 2.9-6Z"/></svg>' +
      '</span>' +
      '<span>' +
        '<span class="nf-badge__num">' + CONFIG.rating + '</span> ' +
        '<span class="nf-stars" aria-hidden="true">★★★★★</span>' +
        '<small>' + CONFIG.reviews + ' happy customers</small>' +
      '</span>';
    return a;
  }

  function addSchema() {
    if (!CONFIG.schema) return;
    var script = document.createElement("script");
    script.type = "application/ld+json";
    script.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      name: (document.title || "Shop").replace(/\s+[|–—-].*$/, "") || "Shop",
      aggregateRating: {
        "@type": "AggregateRating",
        ratingValue: CONFIG.rating,
        bestRating: "5",
        reviewCount: CONFIG.reviews.replace(/[^\d]/g, "")
      }
    });
    document.head.appendChild(script);
  }

  function mount() {
    if (!document.querySelector(".nf-band")) {
      var band = buildBand();
      var footer = document.querySelector("footer");
      if (footer && footer.parentNode) {
        footer.parentNode.insertBefore(band, footer);
      } else {
        document.body.appendChild(band);
      }
    }

    if (CONFIG.showBadge && !document.querySelector(".nf-badge")) {
      document.body.appendChild(buildBadge());
    }

    addSchema();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
