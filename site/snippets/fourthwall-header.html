<!--
  ============================================================
  NEURIO · HEADER CODE (Fourthwall)
  Shop settings → Edit HTML code → Header code
  Then tick "Enable header code" and Save.

  Size: ~5.6 KB (limit 30,000)
  Adds the light announcement / 5-star trust bar at the very top.
  No external fonts, images or libraries.

  Put the footer snippet (fourthwall-footer.html) in "Footer code"
  for the reviews band, floating rating badge and structured data.
  ============================================================
-->

<style id="neurio-header-style">
  .nw-bar, .nw-bar * { box-sizing: border-box; }

  html { scroll-behavior: smooth; scroll-padding-top: 90px; }

  /* page surface: light */
  body { background-color: #f5f6fb; }
  ::selection { background: rgba(106, 76, 245, 0.18); }

  .nw-bar {
    position: relative;
    z-index: 60;
    display: flex; align-items: center; justify-content: center;
    gap: 16px; flex-wrap: wrap;
    padding: 9px 46px 9px 18px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px; line-height: 1.45; letter-spacing: -0.01em;
    color: #34405a;
    background: linear-gradient(90deg, #f3efff 0%, #eef9f5 55%, #f7f2ff 100%);
    border-bottom: 1px solid rgba(15, 23, 42, 0.09);
  }
  .nw-bar__group { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .nw-bar__stars { color: #e8a01f; letter-spacing: 1.5px; font-size: 12px; line-height: 1; }
  .nw-bar b { font-weight: 600; color: #0c1222; }
  .nw-bar__dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(15, 23, 42, 0.28); flex: none; }
  .nw-bar__meta { color: #5a6478; display: inline-flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .nw-bar__meta svg { width: 13px; height: 13px; stroke: #0b8f6b; fill: none; }
  .nw-bar__code {
    padding: 2px 7px; border-radius: 6px;
    background: #ffffff; border: 1px solid rgba(15, 23, 42, 0.16);
    color: #5334e8; font-weight: 600; letter-spacing: 0.04em; font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .nw-bar__close {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    border: 0; background: rgba(255, 255, 255, 0.7); color: #4b556b;
    cursor: pointer; transition: background 0.2s, color 0.2s;
  }
  .nw-bar__close:hover { background: #fff; color: #0c1222; }
  .nw-bar__close svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  .nw-bar.is-hidden { display: none; }

  @media (max-width: 640px) {
    .nw-bar { font-size: 12px; gap: 6px; padding: 8px 40px 8px 12px; justify-content: flex-start; }
    .nw-bar__meta { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .nw-bar__close { transition: none; }
  }

  /* ------------------------------------------------------------
     OPTIONAL — full light theme override.
     Uncomment only if your shop theme is dark and you want it
     light everywhere. Check every page afterwards (contrast!).
     ------------------------------------------------------------
  body, .page, main, #shop, .shop { background-color: #f5f6fb !important; color: #0c1222 !important; }
  a { color: #5334e8; }
  ------------------------------------------------------------ */
</style>

<script>
(function () {
  "use strict";

  /* ------------------ CONFIG ------------------ */
  var CONFIG = {
    rating: "5.0",
    reviews: "3,200+",
    promo: "LAUNCH30",              // "" hides the code chip
    promoText: "30% off with code",
    perks: ["Instant download", "Lifetime updates", "14-day guarantee"],
    memoryHours: 24                 // how long the "x" hides the bar
  };

  var KEY = "neurio.headerBar.hiddenUntil";

  function el(tag, className, html) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (html) node.innerHTML = html;
    return node;
  }

  function buildBar() {
    var bar = el("div", "nw-bar");
    bar.setAttribute("role", "region");
    bar.setAttribute("aria-label", "Shop highlights");

    var left = el("div", "nw-bar__group",
      '<span class="nw-bar__stars" aria-label="' + CONFIG.rating + ' out of 5 stars">★★★★★</span>' +
      '<span>Rated <b>' + CONFIG.rating + '</b> by <b>' + CONFIG.reviews + '</b> customers</span>'
    );

    var meta = el("div", "nw-bar__meta");
    CONFIG.perks.forEach(function (perk, i) {
      if (i > 0) meta.appendChild(el("span", "nw-bar__dot"));
      meta.appendChild(el("span", null,
        '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg>'
      ));
      meta.appendChild(document.createTextNode(perk));
    });

    if (CONFIG.promo) {
      meta.appendChild(el("span", "nw-bar__dot"));
      meta.appendChild(document.createTextNode(CONFIG.promoText + " "));
      meta.appendChild(el("span", "nw-bar__code", CONFIG.promo));
    }

    var close = el("button", "nw-bar__close",
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>'
    );
    close.type = "button";
    close.setAttribute("aria-label", "Dismiss announcement");
    close.addEventListener("click", function () {
      bar.classList.add("is-hidden");
      try {
        localStorage.setItem(KEY, String(Date.now() + CONFIG.memoryHours * 3600 * 1000));
      } catch (e) {}
    });

    bar.appendChild(left);
    bar.appendChild(meta);
    bar.appendChild(close);
    return bar;
  }

  function mount() {
    var hiddenUntil = 0;
    try { hiddenUntil = Number(localStorage.getItem(KEY) || 0); } catch (e) {}
    if (Date.now() < hiddenUntil) return;
    if (document.querySelector(".nw-bar")) return;
    document.body.insertBefore(buildBar(), document.body.firstChild);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
