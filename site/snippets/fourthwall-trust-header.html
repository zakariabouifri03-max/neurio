<!--
  ============================================================
  NEURIO · LIGHT STORE SNIPPET FOR FOURTHWALL
  Paste into: Shop settings → Edit HTML code → Header code
  (Footer code works too — the snippet mounts itself.)

  Fits well under Fourthwall's 30,000 character limit.
  No external fonts, images or libraries. Inline SVG only.

  Edit the CONFIG block at the top of the script to change the
  wording, rating, promo code and links.
  ============================================================
-->

<style id="neurio-light-style">
  .nw-bar, .nw-badge, .nw-bar *, .nw-badge * { box-sizing: border-box; }

  .nw-bar {
    position: relative;
    z-index: 60;
    display: flex; align-items: center; justify-content: center;
    gap: 18px; flex-wrap: wrap;
    padding: 9px 46px 9px 18px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px; line-height: 1.45; letter-spacing: -0.01em;
    color: #34405a;
    background: linear-gradient(90deg, #f3efff 0%, #eef9f5 55%, #f7f2ff 100%);
    border-bottom: 1px solid rgba(15, 23, 42, 0.09);
  }
  .nw-bar__group { display: inline-flex; align-items: center; gap: 8px; }
  .nw-bar__stars { color: #e8a01f; letter-spacing: 1.5px; font-size: 12px; line-height: 1; }
  .nw-bar b { font-weight: 600; color: #0c1222; }
  .nw-bar__dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(15, 23, 42, 0.28); }
  .nw-bar__meta { color: #5a6478; display: inline-flex; align-items: center; gap: 8px; }
  .nw-bar__meta svg { width: 14px; height: 14px; stroke: #0b8f6b; }
  .nw-bar__code {
    padding: 2px 7px; border-radius: 6px;
    background: #ffffff; border: 1px solid rgba(15, 23, 42, 0.16);
    color: #5334e8; font-weight: 600; letter-spacing: 0.04em; font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .nw-bar__close {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    border: 0; background: rgba(255, 255, 255, 0.7); color: #4b556b;
    cursor: pointer; transition: background 0.2s, color 0.2s;
  }
  .nw-bar__close:hover { background: #fff; color: #0c1222; }
  .nw-bar__close svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  .nw-bar.is-hidden { display: none; }

  .nw-badge {
    position: fixed; left: 18px; bottom: 18px; z-index: 9998;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px 9px 12px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 12px; line-height: 1.2; color: #34405a; text-decoration: none;
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid rgba(15, 23, 42, 0.1);
    border-radius: 999px;
    box-shadow: 0 16px 36px -18px rgba(16, 24, 40, 0.45);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: transform 0.25s cubic-bezier(0.22, 0.61, 0.36, 1), box-shadow 0.25s;
  }
  .nw-badge:hover { transform: translateY(-2px); box-shadow: 0 22px 40px -20px rgba(16, 24, 40, 0.5); }
  .nw-badge__num { font-size: 15px; font-weight: 700; color: #0c1222; letter-spacing: -0.02em; }
  .nw-badge__stars { color: #e8a01f; letter-spacing: 1.5px; font-size: 11px; line-height: 1; }
  .nw-badge small { display: block; color: #6b7688; font-size: 11px; margin-top: 2px; }
  .nw-badge__icon {
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center; flex: none;
    background: linear-gradient(140deg, #8b72ff, #22d3ee);
  }
  .nw-badge__icon svg { width: 14px; height: 14px; fill: #fff; stroke: none; }

  @media (max-width: 640px) {
    .nw-bar { font-size: 12px; gap: 6px; padding: 8px 40px 8px 12px; }
    .nw-bar__meta { display: none; }
    .nw-badge { left: 10px; bottom: 10px; padding: 8px 12px 8px 10px; }
    .nw-badge small { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .nw-badge, .nw-bar__close { transition: none; }
  }
</style>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------
     CONFIG — edit these values
     ------------------------------------------------------------ */
  var CONFIG = {
    rating: "5.0",
    reviews: "3,200+",
    promo: "LAUNCH30",              // set to "" to hide the code chip
    promoText: "30% off with code",
    perks: ["Instant download", "Lifetime updates", "14-day guarantee"],
    badgeText: "happy customers",
    badgeLink: "#reviews",          // where the floating badge points
    barMemoryHours: 24,             // how long "x" hides the bar
    schema: true                    // add AggregateRating structured data
  };

  var BARS_KEY = "neurio.bar.hiddenUntil";

  function el(tag, className, html) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (html) node.innerHTML = html;
    return node;
  }

  function stars() {
    return '<span class="nw-bar__stars" aria-label="' + CONFIG.rating + ' out of 5 stars">★★★★★</span>';
  }

  function buildBar() {
    var bar = el("div", "nw-bar");
    bar.setAttribute("role", "region");
    bar.setAttribute("aria-label", "Shop highlights");

    var left = el("div", "nw-bar__group",
      stars() +
      '<span>Rated <b>' + CONFIG.rating + '</b> by <b>' + CONFIG.reviews + '</b> customers</span>'
    );

    var meta = el("div", "nw-bar__meta");
    CONFIG.perks.forEach(function (perk, i) {
      if (i > 0) meta.appendChild(el("span", "nw-bar__dot"));
      meta.appendChild(el("span", null,
        '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg>'
      ));
      meta.appendChild(el("span", null, perk));
    });

    if (CONFIG.promo) {
      meta.appendChild(el("span", "nw-bar__dot"));
      meta.appendChild(el("span", null, CONFIG.promoText + ' '));
      meta.appendChild(el("span", "nw-bar__code", CONFIG.promo));
    }

    var close = el("button", "nw-bar__close",
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>'
    );
    close.type = "button";
    close.setAttribute("aria-label", "Dismiss announcement");
    close.addEventListener("click", function () {
      bar.classList.add("is-hidden");
      try {
        localStorage.setItem(BARS_KEY, String(Date.now() + CONFIG.barMemoryHours * 3600 * 1000));
      } catch (e) { /* private mode */ }
    });

    bar.appendChild(left);
    bar.appendChild(meta);
    bar.appendChild(close);
    return bar;
  }

  function buildBadge() {
    var a = document.createElement("a");
    a.className = "nw-badge";
    a.href = CONFIG.badgeLink;
    a.setAttribute("aria-label", "Rated " + CONFIG.rating + " out of 5 by " + CONFIG.reviews + " customers");
    a.innerHTML =
      '<span class="nw-badge__icon" aria-hidden="true">' +
        '<svg viewBox="0 0 24 24"><path d="m12 2.6 2.9 6 6.6.9-4.8 4.6 1.2 6.5-5.9-3.2-5.9 3.2 1.2-6.5L2.5 9.5l6.6-.9 2.9-6Z"/></svg>' +
      '</span>' +
      '<span>' +
        '<span class="nw-badge__num">' + CONFIG.rating + '</span> ' +
        '<span class="nw-badge__stars" aria-hidden="true">★★★★★</span>' +
        '<small>' + CONFIG.reviews + " " + CONFIG.badgeText + '</small>' +
      '</span>';
    return a;
  }

  function addSchema() {
    if (!CONFIG.schema) return;
    var script = document.createElement("script");
    script.type = "application/ld+json";
    script.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      name: document.title.replace(/\s+[|–—-].*$/, "") || "Shop",
      aggregateRating: {
        "@type": "AggregateRating",
        ratingValue: CONFIG.rating,
        bestRating: "5",
        reviewCount: CONFIG.reviews.replace(/[^\d]/g, "")
      }
    });
    document.head.appendChild(script);
  }

  function mount() {
    var hiddenUntil = 0;
    try { hiddenUntil = Number(localStorage.getItem(BARS_KEY) || 0); } catch (e) { hiddenUntil = 0; }

    if (!document.querySelector(".nw-badge")) {
      document.body.appendChild(buildBadge());
    }

    if (Date.now() > hiddenUntil && !document.querySelector(".nw-bar")) {
      document.body.insertBefore(buildBar(), document.body.firstChild);
    }

    addSchema();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
