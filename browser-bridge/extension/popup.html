<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Download Manager Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <div class="brand"><span class="mark">↯</span><div><strong>AI Download Manager</strong><small>Explicit link handoff</small></div></div>
    <p class="intro">Send the current tab's URL to your desktop app. This action does not read or store browsing history.</p>
    <button id="send" type="button">Send current URL</button>
    <p id="status" role="status" aria-live="polite">Only HTTP and HTTPS URLs are accepted.</p>
    <div class="footer">Direct connection · No proxy or access bypass</div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
