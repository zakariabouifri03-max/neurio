plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// Version info comes from pubspec via the Flutter tool; fall back safely
// if the extension is unavailable in unusual Gradle invocations.
def tasklyVersionCode = 1
def tasklyVersionName = "1.0.0"
try {
    tasklyVersionCode = flutter.versionCode as int
    tasklyVersionName = flutter.versionName as String
} catch (ignored) {
    logger.warn("Taskly: flutter version properties unavailable, using defaults")
}

android {
    namespace "com.taskly.app"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        // Required by flutter_local_notifications for java.time APIs on
        // older Android versions.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.taskly.app"
        minSdk 23
        targetSdk 36
        versionCode tasklyVersionCode
        versionName tasklyVersionName
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile keystoreProperties["storeFile"] ?
                        file(keystoreProperties["storeFile"]) : null
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Use your upload key when key.properties exists; otherwise fall
            // back to debug signing so local release builds still work.
            signingConfig keystorePropertiesFile.exists() ?
                    signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
