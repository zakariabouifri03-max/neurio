name: Taskly CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: taskly
        run: flutter pub get

      - name: Verify formatting
        working-directory: taskly
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: taskly
        run: flutter analyze --fatal-infos

      - name: Run tests
        working-directory: taskly
        run: flutter test --coverage

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: taskly/coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Release Android App Bundle
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: taskly
        run: flutter pub get

      - name: Build release App Bundle (.aab)
        working-directory: taskly
        run: flutter build appbundle --release

      - name: Build release APK (side-load testing)
        working-directory: taskly
        run: flutter build apk --release

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: taskly-release
          path: |
            taskly/build/app/outputs/bundle/release/app-release.aab
            taskly/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
