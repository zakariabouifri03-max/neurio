; BlockStrike Royale - Android export presets.
;
; Signing is deliberately NOT stored in this file: export_presets.cfg is committed,
; and committing a keystore path or password would leak a release key.  For a
; signed release build either
;   * set the environment variables below and use the "Android Release (signed)"
;     preset (Godot reads the keystore path from the environment when it is
;     configured as such), or
;   * open the project once in the Godot editor and enter the keystore in
;     Project > Export > Android Release (Godot then writes the path into the
;     user-local export settings, not into this file).
;
; Debug builds work with the debug keystore that Godot/Apache generate for you,
; so a debug APK needs no credentials at all.

[preset.0]

name="Android Debug"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="*.md, docs/*, tools/*, tests/*"
export_path="build/blockstrike-royale-debug.apk"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="com.blockstrike.royale"
package/name="BlockStrike Royale"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192="res://assets/icons/icon_192.png"
launcher_icons/adaptive_foreground_432x432="res://assets/icons/adaptive_foreground_432.png"
launcher_icons/adaptive_background_432x432="res://assets/icons/adaptive_background_432.png"
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/custom_permissions=PackedStringArray()
permissions/internet=true
permissions/access_network_state=true
permissions/access_wifi_state=true
permissions/change_wifi_state=false
permissions/access_fine_location=false
permissions/access_coarse_location=false
permissions/vibrate=true
permissions/wake_lock=true
permissions/read_external_storage=false
permissions/write_external_storage=false
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""
version_code_note="Run tools/android/release_check.sh before bumping."

