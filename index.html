<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#20251f" />
    <meta
      name="description"
      content="Neurio — your personal Instagram growth workspace. Plan better content, build consistent habits, and grow with intention."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Neurio" />
    <title>Neurio — Grow with intention.</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/neurio.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/neurio-192.png" />
    <link rel="stylesheet" href="src/neurio.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="modal-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="src/neurio.js"></script>
    <script>
      if (!window.NeurioAndroid && "serviceWorker" in navigator)
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("./sw.js").catch(() => {}),
        );
    </script>
  </body>
</html>
