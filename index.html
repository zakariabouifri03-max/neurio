<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏁 Bash Baqi Racing</title>
<meta name="theme-color" content="#0ea5e9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bash Baqi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<!-- error overlay -->
<div id="errLog"></div>

<!-- loading -->
<div id="loading">
  <div class="loadBox">
    <div class="loadFlag">🏁</div>
    <div class="loadTitle">BASH BAQI<br>RACING</div>
    <div class="loadBar"><div></div></div>
    <div class="loadTip">warming up the buggies…</div>
  </div>
</div>

<!-- speed lines overlay -->
<div id="speedLines"></div>
<div id="coinPops"></div>

<!-- ══════════ RACE HUD ══════════ -->
<div id="hud">
  <div class="hudTL">
    <div class="hudChip place"><span class="lbl">PLACE</span><b id="hudPlace">6/6</b></div>
    <div class="hudChip"><span class="lbl">LAP</span><b id="hudLap">1/2</b></div>
    <div class="hudChip slim"><span class="lbl">⏱</span><b id="hudTime">0:00</b></div>
    <div class="hudChip slim gold"><span class="lbl">🪙</span><b id="hudCoins">+0</b></div>
  </div>

  <div id="progbar">
    <span class="flagL">🏁</span>
    <div class="track"><div id="progMarkers"></div></div>
    <span class="flagR">🏆</span>
  </div>

  <button id="btnPauseTop" class="roundBtn">⏸</button>

  <div class="mapWrap"><canvas id="minimap" width="108" height="108"></canvas></div>

  <div id="powerSlot" class="powerSlot">
    <span id="hudPower"></span>
    <span class="keyHint">SPACE</span>
  </div>

  <div id="speedo"><b id="kmh">0</b><span>km/h</span></div>

  <div id="banner"></div>

  <!-- touch controls -->
  <div id="touchWrap">
    <div class="tcol left">
      <button id="tLeft" class="tbtn">◀</button>
      <button id="tRight" class="tbtn">▶</button>
    </div>
    <div class="tcol right">
      <button id="tBrake" class="tbtn brake">▼</button>
    </div>
  </div>
</div>

<!-- ══════════ GARAGE UI ══════════ -->
<div id="garageUI">
  <div id="topbar">
    <div class="stat"><span>🏆</span><b id="statTrophies">0</b></div>
    <div class="stat coin"><span>🪙</span><b id="statCoins">0</b></div>
    <div class="stat gem"><span>💎</span><b id="statGems">0</b></div>
    <div class="spacer"></div>
    <button id="btnInstall" class="miniBtn" hidden title="Install app">📱</button>
    <button id="btnMusic" class="miniBtn">🎵</button>
    <button id="btnSfx" class="miniBtn">🔊</button>
    <button id="btnFull" class="miniBtn">⛶</button>
  </div>

  <div id="logo">🏁 BASH BAQI <span>RACING</span></div>
  <div id="carNamePlate"></div>

  <div id="menuBar">
    <button id="btnUpg" class="mbtn small">🔧<span>Upgrades</span></button>
    <button id="btnCustom" class="mbtn small">🎨<span>Customize</span></button>
    <button id="btnShop" class="mbtn small">🛒<span>Cars</span></button>
    <button id="btnSeries" class="mbtn small">🏆<span>Series</span></button>
    <button id="btnHelp" class="mbtn small">❓<span>Help</span></button>
    <button id="btnRace" class="mbtn race">🏁<span>RACE!</span></button>
  </div>
</div>

<!-- ══════════ Shop / panels ══════════ -->
<div id="panel">
  <div class="panelBox">
    <div class="panelHead">
      <h2 id="panelTitle">SHOP</h2>
      <div id="panelTabs"></div>
      <button id="panelClose" class="roundBtn">✖</button>
    </div>
    <div id="panelBody"></div>
  </div>
</div>

<!-- results -->
<div id="results"><div class="modalBox"><div id="resultsBody"></div></div></div>
<div id="seasonModal"><div class="modalBox"><div id="seasonBody"></div></div></div>

<!-- pause -->
<div id="pauseModal">
  <div class="modalBox">
    <div class="rtitle">⏸ PAUSED</div>
    <div class="rbtns">
      <button id="btnResume" class="big race">▶ RESUME</button>
      <button id="btnQuitRace" class="big ghost">🏠 QUIT TO GARAGE</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="confetti"></div>

<script type="module" src="src/main.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
