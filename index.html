<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>برج إيفل · Tour Eiffel 3D</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗼</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- شاشة التحميل -->
  <div id="loader" aria-hidden="true">
    <div class="loader-icon">🗼</div>
    <div class="loader-text">جارٍ بناء البرج…</div>
    <div class="loader-bar"><span></span></div>
  </div>

  <!-- العنوان -->
  <header class="hud hud-top">
    <h1>برج إيفل <span class="fr">Tour Eiffel</span></h1>
    <p class="sub">باريس · 1889 — غوستاف إيفل · نموذج ثلاثي الأبعاد</p>
  </header>

  <!-- أزرار التحكم -->
  <div class="hud hud-actions">
    <button id="btn-theme" class="chip" title="ليل / نهار">🌙</button>
    <button id="btn-rotate" class="chip" title="دوران تلقائي">⏸</button>
    <button id="btn-full" class="chip" title="ملء الشاشة">⛶</button>
    <a href="./car.html" class="chip" title="سوق الطوموبيل" style="text-decoration:none">🏎️</a>
  </div>

  <!-- بطاقة المعلومات -->
  <aside class="hud facts" dir="rtl">
    <div class="fact"><span class="k">الارتفاع</span><span class="v">330 m</span></div>
    <div class="fact"><span class="k">الطوابق</span><span class="v">3</span></div>
    <div class="fact"><span class="k">الوزن الحديدي</span><span class="v">7 300 t</span></div>
    <div class="fact"><span class="k">سالبات الضوء</span><span class="v">20 000 💡</span></div>
  </aside>

  <!-- تلميح التحكم -->
  <footer class="hud hint" dir="rtl">
    🖱️ اسحب للدوران · عجلة الفأرة للتقريب · الزر الأيمن للإزاحة · اضغط <b>N</b> للليل
  </footer>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
