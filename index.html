<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090d14" />
  <meta name="description" content="NEXUS VIDEO STUDIO — edit your videos by simply telling the AI what you want." />
  <title>NEXUS VIDEO STUDIO</title>
  <link rel="icon" type="image/svg+xml" href="/nexus-mark.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/src/studio.css" />
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="boot-screen"><div class="brand-mark">N</div><strong>NEXUS VIDEO STUDIO</strong><span>Loading local editing workspace…</span></div>
  </div>
  <input id="mediaInput" type="file" multiple accept="video/*,audio/*,image/png,image/jpeg,image/webp" hidden />
  <input id="projectInput" type="file" accept=".nexusvideo,application/json" hidden />
  <input id="modelInput" type="file" accept=".gguf,.bin,.exe" hidden />
  <script type="module" src="/src/studio.js"></script>
</body>
</html>
