<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STREAMER LIFE: ZERO TO FAMOUS</title>
<meta name="theme-color" content="#090d16">
<meta name="description" content="3D First-Person Life Simulator: Building a streaming career from zero.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/"
  }
}
</script>
<style>
#loading {
  position: fixed;
  inset: 0;
  background: #090d16;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #f8fafc;
  transition: opacity 0.5s ease;
}
.loadBox {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 16px;
}
.loadLogo {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.loadSub {
  font-size: 13px;
  color: #94a3b8;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.loadBar {
  width: 240px;
  height: 4px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
.loadBar div {
  width: 100%;
  height: 100%;
  background: #38bdf8;
  animation: loadAnim 1.2s infinite ease-in-out;
  transform-origin: 0% 50%;
}
@keyframes loadAnim {
  0% { transform: scaleX(0); }
  50% { transform: scaleX(0.7); }
  100% { transform: scaleX(1); }
}
.loadControls {
  margin-top: 14px;
  font-size: 12px;
  color: #64748b;
  line-height: 1.6;
}
.loadControls kbd {
  background: #1e293b;
  color: #cbd5e1;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid #334155;
  font-family: inherit;
  font-size: 11px;
}
</style>
</head>
<body>

<div id="app"></div>

<!-- Loading Splash -->
<div id="loading">
  <div class="loadBox">
    <div class="loadLogo">STREAMER LIFE</div>
    <div class="loadSub">ZERO TO FAMOUS</div>
    <div class="loadBar"><div></div></div>
    <div class="loadControls">
      <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> Move • <kbd>SHIFT</kbd> Sprint • <kbd>SPACE</kbd> Jump • <kbd>E</kbd> Interact<br>
      <kbd>TAB</kbd> Smartphone • <kbd>ESC</kbd> Stand Up / Close
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>

</body>
</html>
