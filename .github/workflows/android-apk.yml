name: Android debug APK

on:
  push:
    branches:
      - arena/22c19685-neurio
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android SDK command-line tools were not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Report Gradle failure details
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/gradle-build.log"
          if [[ -f "$log" ]]; then
            details="$(grep -E '(^e: |error:|^FAILURE:|^\* What went wrong:|^[[:space:]]*> |Exception|Could not )' "$log" | tail -n 60 || true)"
            if [[ -z "$details" ]]; then details="$(tail -n 100 "$log")"; fi
            {
              echo '## Gradle failure details'
              echo '```text'
              printf '%s\n' "$details"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              [[ -z "$line" ]] || printf '::error title=Gradle build::%s\n' "$line"
            done <<< "$details"
          else
            echo 'Gradle log was not created.' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::Gradle log was not created.'
          fi

      - name: Record APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: neurio-lan-stream-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
