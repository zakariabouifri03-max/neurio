name: Android debug APK

on:
  push:
    branches:
      - arena/22c19685-neurio
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android SDK command-line tools were not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Report Gradle failure details
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/gradle-build.log"
          if [[ -f "$log" ]]; then
            diagnostics="$(grep -E '(^e: |error:|FAILURE:|What went wrong:|Caused by:|Execution failed for task|A problem occurred|Could not )' "$log" | tail -n 40 || true)"
            failure_tail="$(awk '/^FAILURE: Build failed with an exception\./ { capture=1 } capture { print }' "$log" | tail -n 40)"
            if [[ -z "$failure_tail" ]]; then failure_tail="$(tail -n 40 "$log")"; fi
            {
              echo '## Gradle failure details'
              echo '### Diagnostics'
              echo '```text'
              printf '%s\n' "${diagnostics:-No matching diagnostic lines}"
              echo '```'
              echo '### Failure tail'
              echo '```text'
              printf '%s\n' "$failure_tail"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            {
              printf '%s\n' "$diagnostics"
              printf '%s\n' "$failure_tail" | grep -Ev '^> Task |^$' | tail -n 25
            } | awk 'NF { print "::error title=Gradle build::" $0 }'
          else
            echo 'Gradle log was not created.' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::Gradle log was not created.'
          fi

      - name: Record APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: neurio-lan-stream-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
