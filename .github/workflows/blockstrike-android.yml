name: BlockStrike Royale Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/87f553b8-neurio

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: 4.7.2
      GODOT_TAG: 4.7.2-stable
      APK_PATH: godot/build/BlockStrikeRoyale-debug.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools and SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools" "$RUNNER_TEMP/android-tools"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/android-tools/tools.zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q "$RUNNER_TEMP/android-tools/tools.zip" -d "$RUNNER_TEMP/android-tools"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          cp -R "$RUNNER_TEMP/android-tools/cmdline-tools/." "$SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot/editor.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot/editor.zip" -d "$RUNNER_TEMP/godot/editor"
          export GODOT_BIN="$RUNNER_TEMP/godot/editor/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          find "$RUNNER_TEMP/godot/templates" -type f -name 'android_debug.apk' -exec cp {} "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" \;
          find "$RUNNER_TEMP/godot/templates" -type f -name 'android_release.apk' -exec cp {} "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" \;
          find "$RUNNER_TEMP/godot/templates" -type f -name 'android_source.zip' -exec cp {} "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" \;
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Validate and export debug APK
        id: export_apk
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p godot/build
          "$GODOT_BIN" --headless --editor --path godot --quit 2>&1 | tee godot-editor.log
          editor_status=${PIPESTATUS[0]}
          "$GODOT_BIN" --headless --path godot --export-debug "Android" "$APK_PATH" 2>&1 | tee godot-export.log
          export_status=${PIPESTATUS[0]}
          if [ "$editor_status" -ne 0 ] || [ "$export_status" -ne 0 ] || [ ! -s "$APK_PATH" ]; then
            echo "Godot export failed: editor=$editor_status export=$export_status"
            exit 1
          fi
          find "$ANDROID_HOME/build-tools" -name apksigner -type f -print -quit | xargs -r -I{} {} verify --verbose "$APK_PATH"

      - name: Upload Godot build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlockStrikeRoyale-build-logs
          path: |
            godot-editor.log
            godot-export.log
          if-no-files-found: warn

      - name: Publish Godot diagnostics for failed export
        if: always() && steps.export_apk.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "BlockStrike Royale Godot export diagnostics for run ${GITHUB_RUN_ID}"
            echo
            echo '--- editor log ---'
            cat godot-editor.log 2>/dev/null || true
            echo
            echo '--- export log ---'
            cat godot-export.log 2>/dev/null || true
          } > godot-diagnostics.md
          gh release create "blockstrike-diagnostics-${GITHUB_RUN_ID}" \
            --title "BlockStrike build diagnostics ${GITHUB_RUN_ID}" \
            --prerelease --notes-file godot-diagnostics.md

      - name: Fail if APK export failed
        if: steps.export_apk.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockStrikeRoyale-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish direct GitHub release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blockstrike-royale-v0.1.0
          name: BlockStrike Royale 0.1.0 Android APK
          prerelease: true
          generate_release_notes: false
          overwrite_files: true
          files: ${{ env.APK_PATH }}
          body: |
            Playable offline prototype build for BlockStrike Royale.

            This APK contains the procedural voxel map, third-person controls, bots, weapons, pickups, safe zone, building, mobile HUD, generated audio, and local progression. Internet multiplayer is not enabled; the LAN transport layer is experimental.
