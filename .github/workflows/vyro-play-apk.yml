name: VYRO PLAY – build APK

# Builds the VYRO PLAY Android app and publishes a downloadable debug APK.
#
# The API key is read from the repository secret YOUTUBE_API_KEY and injected as an
# environment variable at build time, so no credential is ever committed.
# Add it under Settings -> Secrets and variables -> Actions -> New repository secret.
# The build works without it too: the app then asks the user for a key in Settings.

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/vyro-play-apk.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

concurrency:
  group: vyro-play-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Run unit tests
        working-directory: android
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        working-directory: android
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vyro-play-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyro-play-test-reports
          path: |
            android/app/build/reports/tests/**
            android/core/build/reports/tests/**
          retention-days: 7
