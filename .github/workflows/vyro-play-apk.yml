name: VYRO PLAY – build APK

# Builds the VYRO PLAY Android app and publishes a downloadable debug APK.
#
# The API key is read from the repository secret YOUTUBE_API_KEY and injected as an
# environment variable at build time, so no credential is ever committed.
# Add it under Settings -> Secrets and variables -> Actions -> New repository secret.
# The build works without it too: the app then asks the user for a key in Settings.

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/vyro-play-apk.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

concurrency:
  group: vyro-play-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Test and assemble
        id: build
        working-directory: android
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -o pipefail
          ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Publish build log as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### VYRO PLAY build log (\`${{ steps.build.outcome }}\`)"
            echo
            echo '```'
            tail -c 55000 android/build.log | sed -e 's/```/~~~ /g' -e 's/\r$//'
            echo '```'
          } > /tmp/comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@/tmp/comment.md

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vyro-play-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Also commit the built APK to the branch, so it can be fetched straight from the
      # repository. `[skip ci]` stops this push from triggering the workflow again.
      - name: Commit the APK to the branch
        if: steps.build.outcome == 'success'
        working-directory: android
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/vyro-play-debug.apk
          ls -lh apk/
          git add -f apk/vyro-play-debug.apk
          git commit -m "ci: publish VYRO PLAY debug APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyro-play-test-reports
          path: |
            android/app/build/reports/tests/**
            android/core/build/reports/tests/**
          retention-days: 7
