# Builds a real, installable Filebox APK — no PC, no Android Studio needed.
#
# Trigger it from your phone: open the repo on github.com → Actions →
# "Filebox APK" → "Run workflow". The finished .apk is attached to the run,
# and (on the main branch) published as a release you can download forever.
name: Filebox APK

on:
  workflow_dispatch:
  push:
    branches: [main, arena/740df4cd-neurio]
    paths:
      - 'Filebox/android/**'
      - '.github/workflows/filebox-apk.yml'

permissions:
  contents: write          # needed to publish the release

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Filebox/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Filebox/android/**/*.gradle', 'Filebox/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # there is no gradle-wrapper.jar in the repo (binary blobs stay out of
      # git), so install Gradle itself and let it resolve the pinned version
      - name: Install Gradle 8.7
        run: |
          curl -fsSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build debug APK (signed with the debug key)
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Build unsigned release APK
        run: gradle --no-daemon assembleRelease
        continue-on-error: true      # release signing is optional

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/filebox-debug.apk
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk out/filebox-release-unsigned.apk
          fi
          ls -la out
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: filebox-apk
          path: Filebox/android/out/*

      - name: Publish release (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: filebox-apk-${{ github.run_number }}
          name: Filebox APK #${{ github.run_number }}
          body: |
            APK mبنية mn commit `${{ github.sha }}`.

            **Kifach tsebtha f telefon:**
            1. Telecharji `filebox-debug.apk`
            2. 7ellha f telefon → "Installer quand même" (makaynach 3la Play Store)

            `filebox-release-unsigned.apk` khasso signature 9bel maytsebte.
          files: Filebox/android/out/*
          fail_on_unmatched_files: false
