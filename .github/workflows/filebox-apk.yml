# Builds a real, installable Filebox APK — no PC, no Android Studio needed.
#
# It also publishes the APK to a FIXED release tag, so this URL always serves
# the newest build:
#   https://github.com/zakariabouifri03-max/neurio/releases/download/filebox-v1.0.0/Filebox.apk
#
# Trigger a rebuild from your phone: repo → Actions → "Filebox APK" →
# "Run workflow".
name: Filebox APK

on:
  workflow_dispatch:
  push:
    branches: [main, arena/740df4cd-neurio]
    paths:
      - 'Filebox/android/**'
      - '.github/workflows/filebox-apk.yml'

permissions:
  contents: write          # needed to publish the release

concurrency:
  group: filebox-apk
  cancel-in-progress: false

jobs:
  apk:
    name: Build and publish the Filebox APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the app
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android fails on the current runners, so install
      # the command-line tools directly — this is the path that works.
      - name: Install Android command-line tools
        run: |
          sdk_root="$RUNNER_TEMP/android-sdk"
          tools_zip="$RUNNER_TEMP/android-command-line-tools.zip"
          mkdir -p "$sdk_root/cmdline-tools"
          curl --fail --location --silent --show-error \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            --output "$tools_zip"
          unzip -q "$tools_zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: Filebox/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK for distribution
        run: |
          mkdir -p release-apk
          cp Filebox/android/app/build/outputs/apk/debug/app-debug.apk release-apk/Filebox.apk
          sha256sum release-apk/Filebox.apk | tee release-apk/SHA256SUMS.txt
          ls -la release-apk

      # prove the artifact really is an installable package before publishing it
      - name: Verify the APK
        run: |
          apk=release-apk/Filebox.apk
          echo "== file =="
          file "$apk" || echo "file(1) not installed"
          echo "== zip listing =="
          python3 -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); [print('  %-40s %9d B method=%d' % (n, z.getinfo(n).file_size, z.getinfo(n).compress_type)) for n in sorted(z.namelist())]; print('CRC test:', z.testzip() or 'OK')" "$apk"
          echo "== required entries =="
          python3 -c "import zipfile,sys; n=zipfile.ZipFile(sys.argv[1]).namelist(); miss=[r for r in ('classes.dex','AndroidManifest.xml','resources.arsc') if r not in n]; print('missing:', miss or 'none'); sys.exit(1 if miss else 0)" "$apk"
          echo "== build tools =="
          ls -d "$ANDROID_HOME"/build-tools/* || echo "no build-tools dir"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | tail -1)
          echo "using: ${bt:-none}"
          echo "== apksigner verify =="
          if [ -n "${bt:-}" ]; then "$bt/apksigner" verify --print-certs "$apk" || echo "apksigner exit $?"; fi
          echo "== unzip -l (tail) =="
          unzip -l "$apk" | tail -4
          echo "== VERIFY DONE =="

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filebox-APK
          path: release-apk/Filebox.apk
          if-no-files-found: error
          retention-days: 30

      # a fixed tag means one permanent download link that always points at the
      # latest successful build
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: filebox-v1.0.0
          name: Filebox v1.0.0 — Android APK
          body: |
            📦 **Filebox** — coffre dyal milafat b compression w AES-256-GCM.

            **Lien direct dyal l-APK:**
            `https://github.com/zakariabouifri03-max/neurio/releases/download/filebox-v1.0.0/Filebox.apk`

            **Kifach tsebtha f telefon:**
            1. Telecharji `Filebox.apk`
            2. 7ellha → «Installer quand même» (makaynach 3la Play Store)
            3. Ila Android 900 wla 7jbek: Settings → Apps → Special access →
               Install unknown apps → 3ti permission l Chrome

            - Minimum: Android 7.0 (API 24)
            - Mوقَّع b debug keystore — kaykhdem, walakin machi l Play Store
            - L-build: commit `${{ github.sha }}`
          files: release-apk/Filebox.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
