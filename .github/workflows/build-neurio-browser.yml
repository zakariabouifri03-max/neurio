name: Build Neurio Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the debug APK as a GitHub release download'
        type: boolean
        required: true
        default: false
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-neurio-browser.yml'

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android
      - name: Publish direct APK release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/NeurioBrowser-debug.apk"
          gh release create neurio-browser-v1.0.0-debug \
            "$RUNNER_TEMP/NeurioBrowser-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Neurio Browser v1.0.0 — Debug APK" \
            --notes "Installable Android debug build. Built from commit $GITHUB_SHA. This test APK uses the debug signing key and is not a Play Store release." \
            --prerelease
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: neurio-browser-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
