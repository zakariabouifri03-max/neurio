name: Adzak Download Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'adzak-download-pro-v*'
    paths:
      - 'windows/AdzakDownloadPro/**'
      - '.github/workflows/adzak-download-pro.yml'

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run recovery-engine scenarios
        shell: cmd
        run: dotnet run --project windows/AdzakDownloadPro/tests/AdzakDownloadPro.Tests/AdzakDownloadPro.Tests.csproj --configuration Release

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish windows/AdzakDownloadPro/src/AdzakDownloadPro.WinForms/AdzakDownloadPro.WinForms.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PlatformTarget=x64 -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false
          --output windows/AdzakDownloadPro/artifacts/win-x64

      - name: Upload self-contained Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: AdzakDownloadPro-win-x64
          path: windows/AdzakDownloadPro/artifacts/win-x64/AdzakDownloadPro.WinForms.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct Windows EXE release
        if: startsWith(github.ref, 'refs/tags/adzak-download-pro-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "windows/AdzakDownloadPro/artifacts/win-x64/AdzakDownloadPro.WinForms.exe"
          gh release create "$env:GITHUB_REF_NAME" $exe `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "ADZAK DOWNLOAD PRO $env:GITHUB_REF_NAME" `
            --notes "Self-contained Windows x64 executable. Recovery scenarios and publish passed in GitHub Actions." `
            --prerelease
