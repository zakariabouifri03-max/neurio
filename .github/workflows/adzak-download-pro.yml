name: Adzak Download Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'windows/AdzakDownloadPro/**'
      - '.github/workflows/adzak-download-pro.yml'

jobs:
  test-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run recovery-engine scenarios
        shell: pwsh
        run: |
          $log = "recovery-test.log"
          dotnet run --project windows/AdzakDownloadPro/tests/AdzakDownloadPro.Tests/AdzakDownloadPro.Tests.csproj --configuration Release 2>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $details = (Get-Content $log -Raw) -replace "`r?`n", " | "
            $details = $details.Replace('%', '%25').Replace(':', '%3A').Replace(',', '%2C')
            if ($details.Length -gt 4000) { $details = $details.Substring(0, 4000) }
            Write-Output "::error title=Recovery tests or build failed::$details"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("## Recovery test/build failure`n`n```text`n" + (Get-Content $log -Raw) + "`n```")
          }
          exit $testExit

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish windows/AdzakDownloadPro/src/AdzakDownloadPro.WinForms/AdzakDownloadPro.WinForms.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PlatformTarget=x64 -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false
          --output windows/AdzakDownloadPro/artifacts/win-x64

      - name: Upload self-contained Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: AdzakDownloadPro-win-x64
          path: windows/AdzakDownloadPro/artifacts/win-x64/AdzakDownloadPro.WinForms.exe
          if-no-files-found: error
          retention-days: 30
