name: UltraDownload Windows
on:
  push:
    paths:
      - 'UltraDownload/**'
      - '.github/workflows/ultradownload-windows.yml'
  pull_request:
    paths:
      - 'UltraDownload/**'
      - '.github/workflows/ultradownload-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: UltraDownload
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: UltraDownload/requirements.txt
      - name: Build and test real Windows executable
        shell: pwsh
        run: |
          cmd /c build.bat 2>&1 | Tee-Object -FilePath build-log.txt
          $code = $LASTEXITCODE
          $tests = (Select-String -Path build-log.txt -Pattern '\d+ passed' | Select-Object -Last 1).Line
          if ($tests) { Write-Output "::notice title=Windows test result::$tests" }
          $tail = (Get-Content build-log.txt -Tail 18) -join "`n"
          $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          if ($code -ne 0) { Write-Output "::error title=Windows build diagnostics::$escaped"; exit $code }
          Write-Output "::notice title=Windows build verified::$escaped"
      - name: Record resolved build environment
        shell: pwsh
        run: |
          .venv\Scripts\python.exe -m pip freeze | Out-File dist\build-requirements.txt -Encoding utf8
          (Get-FileHash dist\UltraDownload.exe -Algorithm SHA256).Hash | Out-File dist\UltraDownload.exe.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: UltraDownload-Windows-x64
          path: |
            UltraDownload/dist/UltraDownload.exe
            UltraDownload/dist/UltraDownload.exe.sha256
            UltraDownload/dist/build-requirements.txt
            UltraDownload/README.md
          if-no-files-found: error
          retention-days: 30
  linux-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: UltraDownload
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Test engine and desktop UI
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen python -m pytest -q | tee test-results.txt
          echo "::notice title=Linux test result::$(tail -n 1 test-results.txt)"
      - run: QT_QPA_PLATFORM=offscreen python main.py --smoke-test
