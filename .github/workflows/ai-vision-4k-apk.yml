# Builds the AI Vision 4K Android APK on a real Android toolchain.
#
# Why CI at all: this project is developed in an environment without the Android
# SDK, so the Gradle/NDK build runs here — on the same toolchain an Android
# Studio user has — and the resulting APK is committed back to the branch
# (GitHub artifact blobs are not reachable from that environment, while the
# branch is). The commit is made with GITHUB_TOKEN, which by design does not
# trigger another workflow run, so there is no build loop.
#
# Step order matters: the native core suite runs first (it needs only g++) so a
# broken policy/format change is reported before the slow Android build.

name: AI Vision 4K APK

on:
  push:
    branches: [ arena/e293d70d-neurio ]
    paths:
      - 'ai-vision-4k/**'
      - '.github/workflows/ai-vision-4k-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai-vision-4k
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Native core test suite (host)
        run: bash tools/run-native-tests.sh

      - name: CMake configure + host build (no Vulkan)
        # The fast smoke test for the build files themselves: it catches a
        # CMake or include-path mistake in ~15s instead of three minutes into
        # Gradle, and it is the configuration a developer desktop uses.
        run: |
          set -euo pipefail
          cmake -S aiupscaler-sdk/src/main/cpp -B /tmp/v4k-cmake-check \
            -DV4K_ENABLE_VULKAN=OFF -DV4K_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build /tmp/v4k-cmake-check -j"$(nproc)"

      - name: Static checks (Kotlin imports, JNI bindings)
        # Missing imports and unbalanced delimiters: the two mistakes that have
        # actually broken the Gradle build, caught without the Android SDK.
        #
        # And the JNI tables: a name, signature or class string that does not
        # match the Kotlin side does not fail either compiler, it fails
        # System.loadLibrary on the device, which takes the whole engine with it.
        run: |
          python3 tools/checks/kotlin-imports.py
          python3 tools/checks/jni-bindings.py

      - name: Calibration models are up to date
        # Re-exports the .v4kmodel assets and fails if they differ from the
        # committed ones, so a changed container/op-table cannot leave a stale
        # asset behind.
        run: bash tools/model/generate-calibration-models.sh --check

      - name: Vulkan + JNI + demo syntax check
        # Compiles every native source with the Vulkan backend enabled, which is
        # the only configuration the demo renderer, its JNI bridge and the whole
        # Vulkan backend exist in: the desktop smoke test above deliberately has
        # Vulkan off, so without this step those files would never be compiled
        # until Gradle tried to link them into the APK.
        #
        # The NDK's sysroot has vulkan/vulkan.h; the runner's JDK is the place a
        # complete jni.h + jni_md.h pair exists on this image (they live in two
        # directories, which is why V4K_JNI_INCLUDE takes a colon-separated list).
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export V4K_VULKAN_INCLUDE="$SDK/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          export V4K_JNI_INCLUDE="${JAVA_HOME}/include:${JAVA_HOME}/include/linux"
          bash tools/verify.sh

      - name: Android SDK components
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            curl -sSLo /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-unpack
            mkdir -p "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdline-unpack/cmdline-tools "$SDK/cmdline-tools/latest"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          # Licences: the runner image has them accepted already; this is for the
          # components it does not ship (CMake 3.22.1, the pinned NDK).
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.3.13750724"
          "$SDKMANAGER" --list_installed | sed -n '1,40p'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        # Tee the output: the log is published back to the branch on failure,
        # because the artifact/log download hosts are not reachable from every
        # development environment. `pipefail` keeps Gradle's exit status.
        #
        # The id is what the diagnostics step keys on -- the outcome of this step,
        # not the presence of an APK in dist/.
        id: debug
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee /tmp/build-debug.log

      - name: Assemble release APK
        # Signed with the debug key on purpose: this is a testing build, and a
        # release keystore must never live in a public repository.
        #
        # Best effort: R8 is the one step that can fail for reasons that have
        # nothing to do with whether the app works, and the debug APK is the
        # build this project is judged on.
        id: release
        continue-on-error: true
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Collect APKs and diagnostics
        if: always()
        run: |
          set -uo pipefail
          mkdir -p dist
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/AIVision4K-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/AIVision4K-release-unsigned-key.apk
          else
            echo "release APK not produced (R8 step: ${{ steps.release.outcome }})"
          fi
          if ls dist/*.apk > /dev/null 2>&1; then
            # Standard `sha256sum -c` format: hash, two spaces, file name.
            ( cd dist && sha256sum *.apk > SHA256SUMS.txt )
            cat dist/SHA256SUMS.txt
          fi

          # Diagnostics are keyed on the *build outcome*, never on whether an APK
          # is present in dist/. The APKs are committed to this branch, so a
          # failed build still finds yesterday's files sitting there -- which is
          # exactly how a previous version of this step concluded "success needs
          # no diagnostics" and deleted the one log that explained the failure.
          #
          # A previously built APK is left in place rather than deleted: a stale
          # artifact that still installs is better than no artifact, and the log
          # below says plainly that this run did not produce it.
          if [ "${{ steps.debug.outcome }}" != "success" ]; then
            {
              echo "The debug build did not succeed in this run (${{ steps.debug.outcome }})."
              echo "The APKs in dist/ are from the previous successful build, if any."
              echo
            } > dist/build-log.txt
            if [ -f /tmp/build-debug.log ]; then
              tail -n 1200 /tmp/build-debug.log >> dist/build-log.txt
            else
              echo "the Gradle step produced no log" >> dist/build-log.txt
            fi
            echo "----- last 60 lines of the build log -----"
            tail -n 60 dist/build-log.txt
          else
            rm -f dist/build-log.txt
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-vision-4k-apks
          path: |
            ai-vision-4k/dist/*.apk
            ai-vision-4k/dist/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Publish the APKs back to the branch
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ai-vision-4k/dist
          if git diff --cached --quiet; then
            echo "dist/ unchanged, nothing to publish."
            exit 0
          fi
          git commit -m "ci: AI Vision 4K APK build (${GITHUB_SHA::7}) [skip ci]"
          # The branch moves while this job runs (the author pushes, another run
          # publishes), and a plain push would then be rejected -- which is how a
          # publish step ends up reporting success while publishing nothing. The
          # commit only ever touches dist/, so a rebase is safe.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "published on attempt ${attempt}"
              exit 0
            fi
            sleep 5
          done
          echo "could not publish dist/ after three attempts" >&2
          exit 1

      - name: Publish the APKs as a GitHub release
        # A permanent download link that does not depend on a sandbox session or
        # on being logged in to fetch a CI artifact:
        #
        #   https://github.com/zakariabouifri03-max/neurio/releases/download/\
        #     ai-vision-4k-latest/AIVision4K-debug.apk
        #
        # One moving tag, its assets replaced on every successful build, so the
        # link never changes and always serves the newest APK. The asset upload
        # has to happen here: uploads.github.com is not reachable from every
        # environment that can otherwise use the API.
        #
        # Best effort: a release is a convenience, the APKs in dist/ are the
        # deliverable, and a hiccup here must not mark a good build as failed.
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/ai-vision-4k"
          if [ ! -f dist/AIVision4K-debug.apk ]; then
            echo "no debug APK was produced, nothing to release"
            exit 0
          fi
          TAG="ai-vision-4k-latest"
          NOTES="$(mktemp)"
          {
            echo "Automatic build of **AI Vision 4K** from commit \`${GITHUB_SHA:0:7}\`"
            echo "(workflow run ${GITHUB_RUN_ID}, ${GITHUB_REPOSITORY})."
            echo
            echo "## Download"
            echo
            echo "| file | bytes | sha256 |"
            echo "| --- | --- | --- |"
            while read -r hash name; do
              printf '| \`%s\` | %s | \`%s\` |\n' "$name" "$(stat -c %s "dist/$name")" "$hash"
            done < dist/SHA256SUMS.txt
            echo
            echo "Install \`AIVision4K-debug.apk\` (debug-signed, package \`com.aivision4k.debug\`,"
            echo "Android 8.0+/64-bit): \`adb install -r AIVision4K-debug.apk\`. The release APK is"
            echo "R8-minified and signed with the debug key - testing only."
            echo
            echo "The complete notes for this project live in the repository:"
            echo "\`ai-vision-4k/README.md\` and \`ai-vision-4k/dist/README.md\`, including what has"
            echo "and has not been verified (nothing here has run on real hardware yet)."
          } > "$NOTES"

          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --title "AI Vision 4K - latest debug build" \
              --notes-file "$NOTES" \
              --target "$GITHUB_SHA" \
              || gh release create "$TAG" --title "AI Vision 4K - latest debug build" --notes-file "$NOTES"
          else
            gh release edit "$TAG" --notes-file "$NOTES"
          fi

          gh release upload "$TAG" \
            dist/AIVision4K-debug.apk \
            dist/AIVision4K-release-unsigned-key.apk \
            dist/SHA256SUMS.txt \
            --clobber
          echo "release ${TAG} updated:"
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'
