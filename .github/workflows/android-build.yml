name: Android build

# Builds the LAN Game Stream prototype (lan-game-stream/) with the real Android
# SDK and uploads the installable debug APK as a workflow artifact.

on:
  push:
    branches: ['**']
    paths:
      - 'lan-game-stream/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'lan-game-stream/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

# Needed so the build can publish the APK as a GitHub Release asset, which (unlike
# a workflow artifact) can be downloaded with a plain link, without signing in.
permissions:
  contents: write

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK components
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms" 2>/dev/null || true
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

      - name: Build debug APK
        working-directory: lan-game-stream
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface compiler/resource errors as check-run annotations + step summary
            # so they are readable through the GitHub API from any tooling.
            {
              echo "### Build failed"
              echo '```'
              grep -E "^(e: |.*error: |.*error; |error: )|\.java:[0-9]+: |\.xml:[0-9]+: |FAILURE:|Execution failed" "$RUNNER_TEMP/build.log" | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY" || true
            grep -E "\.java:[0-9]+: |\.xml:[0-9]+: |error: " "$RUNNER_TEMP/build.log" | head -60 | while IFS= read -r line; do
              echo "::error ::${line}"
            done
            exit "$status"
          fi

      - name: Build release APK
        working-directory: lan-game-stream
        run: ./gradlew --no-daemon --console=plain :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp -v lan-game-stream/app/build/outputs/apk/debug/app-debug.apk \
                artifacts/neurio-lan-game-stream-debug.apk
          cp -v lan-game-stream/app/build/outputs/apk/release/app-release.apk \
                artifacts/neurio-lan-game-stream.apk
          ls -la artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: lan-game-stream-apks
          path: artifacts/*.apk
          if-no-files-found: error

      # Publishes the APKs to a rolling pre-release so anyone can install them with
      # a direct link: .../releases/download/apk-latest/neurio-lan-game-stream.apk
      # (Release assets are public; workflow artifacts require a GitHub login.)
      - name: Publish APKs as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/40bae685-neurio'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Installable prototype builds of LAN Game Stream.

          * \`neurio-lan-game-stream.apk\` - release build (debug-signed so it installs directly)
          * \`neurio-lan-game-stream-debug.apk\` - debug build

          Built from commit \`${GITHUB_SHA:0:12}\` on $(date -u '+%Y-%m-%d %H:%M UTC').

          Install on both phones, then: HOST GAME on the phone that has the game, JOIN GAME on the other one. Everything stays on your local Wi-Fi."
          gh release view apk-latest >/dev/null 2>&1 \
            || gh release create apk-latest --title "LAN Game Stream - latest APK" \
                 --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          gh release edit apk-latest --notes "$NOTES"
          gh release upload apk-latest artifacts/*.apk --clobber
