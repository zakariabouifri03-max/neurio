name: SAWT+ Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "src/sawt/**"
      - "index.html"
      - "tools/build-android-assets.mjs"
      - "tools/sawt-png.mjs"
      - "tools/make-sawt-icons.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sawt-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install build tooling
        run: npm ci

      - name: Bundle web assets for the WebView
        run: node tools/build-android-assets.mjs

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK pieces
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Generate signing key (sideload builds)
        run: |
          keytool -genkeypair -v \
            -keystore android/keystore.jks -alias sawt \
            -keyalg RSA -keysize 2048 -validity 10000 -noprompt \
            -storepass sawt-release -keypass sawt-release \
            -dname "CN=SAWT Plus, O=SAWT, C=MA"
          ls -la android/keystore.jks

      - name: Build release APK
        working-directory: android
        env:
          SAWT_KEYSTORE: keystore.jks
          SAWT_STORE_PASS: sawt-release
          SAWT_KEY_PASS: sawt-release
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify package
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | head -n 4
          mkdir -p dist
          cp "$APK" dist/sawt-plus.apk
          ls -la dist/sawt-plus.apk

      - uses: actions/upload-artifact@v7
        with:
          name: sawt-plus-apk
          path: dist/sawt-plus.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: dist/sawt-plus.apk
          TAG: sawt-latest
        shell: bash
        run: |
          TITLE="SAWT+ APK (latest)"
          NOTES=$(cat <<'EOF'
          ## SAWT+ — Volume Booster & Speaker

          Download **sawt-plus.apk** and install it on Android (allow install from unknown sources when prompted).

          Mic amplifier, local file booster, and mixable ambient sounds — boost beyond the max, clean and distortion-free. Everything runs offline inside the app.

          Sideload build signed with a CI-generated key (not a Play Store release). Each new build replaces this asset; the download link stays the same.
          EOF
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --prerelease
          fi
