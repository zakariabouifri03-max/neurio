name: Build ADZAK Lite Browser (Windows x64)

# Builds the real Windows x64 Release binaries on a Windows runner,
# smoke-tests the single-file EXE headlessly, and uploads artifacts.
on:
  workflow_dispatch:
  push:
    branches: [arena/9fb76cdb-neurio]
    paths:
      - 'adzak-lite-browser/**'
      - '.github/workflows/adzak-windows-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore adzak-lite-browser/src/ADZAKLiteBrowser/ADZAKLiteBrowser.csproj

      - name: Publish single-file EXE (self-contained, win-x64)
        run: >
          dotnet publish adzak-lite-browser/src/ADZAKLiteBrowser/ADZAKLiteBrowser.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -p:DebugSymbols=false
          -o publish/single

      - name: Publish folder build (self-contained, win-x64)
        run: >
          dotnet publish adzak-lite-browser/src/ADZAKLiteBrowser/ADZAKLiteBrowser.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=none -p:DebugSymbols=false
          -o publish/folder

      - name: Publish portable EXE (framework-dependent, win-x64)
        run: >
          dotnet publish adzak-lite-browser/src/ADZAKLiteBrowser/ADZAKLiteBrowser.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none -p:DebugSymbols=false
          -o publish/portable

      - name: Ensure WebView2 Runtime (for smoke test)
        shell: pwsh
        run: |
          try {
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:TEMP\WebView2Setup.exe" -UseBasicParsing
            Start-Process "$env:TEMP\WebView2Setup.exe" -ArgumentList '/silent','/install' -Wait -NoNewWindow
          } catch { Write-Host "Runtime setup step warning: $_" }

      - name: Smoke test the single-file EXE (headless, no network)
        shell: pwsh
        run: |
          $p = Start-Process 'publish/single/ADZAKLiteBrowser.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          Write-Host "Smoke test exit code: $($p.ExitCode)"
          $result = Join-Path $env:TEMP 'adzak-smoke-result.json'
          if (Test-Path $result) { Get-Content $result }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed" }
          if (Test-Path $result) { Copy-Item $result publish/smoke-result.json }

      - name: Commit portable EXE + smoke result to this branch
        shell: bash
        run: |
          mkdir -p adzak-lite-browser/dist
          cp publish/portable/ADZAKLiteBrowser.exe adzak-lite-browser/dist/ADZAKLiteBrowser-portable.exe
          cp publish/smoke-result.json adzak-lite-browser/dist/smoke-result.json || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adzak-lite-browser/dist
          if git diff --cached --quiet; then
            echo "No dist changes to commit."
          else
            git commit -m "Add built portable EXE and smoke-test results [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Package artifacts
        shell: pwsh
        run: |
          Copy-Item adzak-lite-browser/README.md publish/ -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/folder/* -DestinationPath publish/ADZAK-Lite-Browser-win-x64-folder.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ADZAK-Lite-Browser-win-x64
          path: |
            publish/single/ADZAKLiteBrowser.exe
            publish/ADZAK-Lite-Browser-win-x64-folder.zip
            publish/README.md
          if-no-files-found: error

      # Every successful build refreshes the permanent GitHub Release with
      # direct-download EXE assets (artifact downloads expire; releases don't).
      - name: Publish GitHub Release (direct EXE downloads)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp publish/single/ADZAKLiteBrowser.exe publish/ADZAKLiteBrowser.exe
          cp publish/portable/ADZAKLiteBrowser.exe publish/ADZAKLiteBrowser-portable.exe
          cat > publish/release-notes.md <<'NOTES'
          Lightweight C#/.NET 8 + WebView2 (Chromium) browser for Windows 10/11 x64 and 8 GB RAM PCs.

          **Which file?**
          - `ADZAKLiteBrowser.exe` — self-contained (recommended): includes the .NET runtime. Only needs the free WebView2 Runtime below.
          - `ADZAKLiteBrowser-portable.exe` (1.0 MB) — needs the free .NET 8 Desktop Runtime (https://dotnet.microsoft.com/download/dotnet/8.0) + WebView2 Runtime.
          - `ADZAK-Lite-Browser-win-x64-folder.zip` — folder layout of the self-contained build.

          WebView2 Runtime (built into Windows 11 and most Windows 10 PCs): https://developer.microsoft.com/microsoft-edge/webview2/

          The EXE is not code-signed, so Windows SmartScreen warns on first launch (More info -> Run anyway).
          Honest test status: CI builds + a headless smoke test of the shipped EXE passed; see adzak-lite-browser/BUILD-RESULTS.md in the repo.
          NOTES
          gh release create adzak-lite-v1.0 \
            --title "ADZAK Lite Browser v1.0 (Windows x64)" \
            --notes-file publish/release-notes.md \
            --target "$GITHUB_REF_NAME" || echo "Release already exists; uploading assets."
          gh release upload adzak-lite-v1.0 \
            publish/ADZAKLiteBrowser.exe \
            publish/ADZAKLiteBrowser-portable.exe \
            publish/ADZAK-Lite-Browser-win-x64-folder.zip \
            --clobber
