name: Build Neurio EXE

on:
  push:
    branches: [main, master, arena/*]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Test processor (offline fallback)
        run: python app/test_processor.py

      - name: Build EXE (PyInstaller)
        run: python app/build.py

      - name: List dist
        run: dir dist

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Neurio-Windows-EXE
          path: dist/Neurio.exe
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (for Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxkbcommon-x11-0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Test
        run: python app/test_processor.py

      - name: Build (Linux)
        run: python app/build.py --onedir

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: Neurio-Linux
          path: dist/Neurio/
          if-no-files-found: warn
