name: Taskly CI

on:
  push:
    branches: ["**"]
    paths:
      - "taskly/**"
      - ".github/workflows/taskly-ci.yml"
  pull_request:
    paths:
      - "taskly/**"
      - ".github/workflows/taskly-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskly
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format (auto-fix and push back if needed)
        run: |
          dart format .
          if ! git diff --quiet; then
            git config user.name "taskly-bot"
            git config user.email "taskly-bot@users.noreply.github.com"
            git add .
            git commit -m "chore(taskly): apply dart format [auto]"
            git push
          fi

      - name: Analyze
        run: |
          set +e
          flutter analyze --fatal-infos 2>&1 | tee /tmp/analyze.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "### flutter analyze" > $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -c 60000 /tmp/analyze.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $code
          fi

      - name: Run tests
        run: |
          set +e
          flutter test 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "### flutter test" > $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -c 60000 /tmp/test.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $code
          fi

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: taskly/coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Release Android App Bundle
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskly
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release App Bundle (.aab)
        run: flutter build appbundle --release

      - name: Build release APK (side-load testing)
        run: flutter build apk --release

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: taskly-release
          path: |
            taskly/build/app/outputs/bundle/release/app-release.aab
            taskly/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
