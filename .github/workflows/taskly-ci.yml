name: Taskly CI

on:
  push:
    branches: ["**"]
    paths:
      - "taskly/**"
      - ".github/workflows/taskly-ci.yml"
  pull_request:
    paths:
      - "taskly/**"
      - ".github/workflows/taskly-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: taskly
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format (auto-fix and push back on push events)
        run: |
          dart format .
          if ! git diff --quiet; then
            if [ "${{ github.event_name }}" = "push" ]; then
              git config user.name "taskly-bot"
              git config user.email "taskly-bot@users.noreply.github.com"
              git add .
              git commit -m "chore(taskly): apply dart format [auto]"
              git push origin "HEAD:${{ github.ref_name }}"
            else
              git diff --stat > $GITHUB_STEP_SUMMARY
              echo '```diff' >> $GITHUB_STEP_SUMMARY
              git diff | head -c 60000 >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "Formatting needed - see summary" >&2
              exit 1
            fi
          fi

      - name: Analyze
        run: |
          set +e
          set +o pipefail
          flutter analyze --fatal-infos 2>&1 | tee /tmp/analyze.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "### flutter analyze" > $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -c 60000 /tmp/analyze.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "error .|warning .|info ." /tmp/analyze.log | head -25 | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -d '\r%')
              echo "::error::${safe:0:500}"
            done
            exit $code
          fi

      - name: Run tests (per-file, bounded, annotated)
        run: |
          set +e
          set +o pipefail
          overall=0
          > /tmp/test.log
          for f in $(find test -name '*_test.dart' | sort); do
            echo "::notice::RUNNING $f"
            timeout 360 flutter test "$f" --timeout 90s > "/tmp/$(basename $f).log" 2>&1
            code=$?
            cat "/tmp/$(basename $f).log" >> /tmp/test.log
            if [ $code -eq 124 ]; then
              echo "::error::TIMEOUT running $f"
              overall=1
            elif [ $code -ne 0 ]; then
              echo "::error::FAILED $f"
              tail -40 "/tmp/$(basename $f).log" | while IFS= read -r line; do
                safe=$(printf '%s' "$line" | tr -d '\r%')
                echo "::error::${safe:0:500}"
              done
              overall=1
            else
              echo "::notice::PASSED $f"
            fi
          done
          if [ $overall -ne 0 ]; then
            echo "### flutter test (failures)" > $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -c 60000 /tmp/test.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $overall
          fi

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: taskly/coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Release Android App Bundle
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: taskly
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release App Bundle (.aab)
        run: flutter build appbundle --release

      - name: Build release APK (side-load testing)
        run: flutter build apk --release

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: taskly-release
          path: |
            taskly/build/app/outputs/bundle/release/app-release.aab
            taskly/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
