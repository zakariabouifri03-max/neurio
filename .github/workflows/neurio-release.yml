name: Neurio — build Windows EXE + Android APK

# Builds every downloadable artefact for Neurio on GitHub's own runners and publishes them as
# real, clickable download links on the release "neurio-latest":
#
#   • Neurio-Setup-<v>.exe        Windows installer (NSIS, per-user, no admin prompt)
#   • Neurio-Portable-<v>.exe     Windows portable EXE (no install, runs from a USB stick)
#   • Neurio-Android-<v>.apk      Phone/tablet app (install, allow "unknown sources")
#   • neurio-server-<v>.zip       The Node server to host on one machine (LAN or VPS)
#   • neurio-web-<v>.zip          Static UI to host anywhere (browser + "Install app" PWA)
#
# No secrets, no signing keys, no paid services: the APK is signed with the standard debug key
# and the EXE is left unsigned (Windows shows the usual "unknown publisher" warning).
#
# Build logs are posted as commit comments as well as job summaries, so a failure can be read
# without downloading artefacts.

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'server/**'
      - 'shared/**'
      - 'src/**'
      - 'electron/**'
      - 'tools/**'
      - 'android/**'
      - 'tests/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/neurio-release.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'src/**'
      - 'android/**'
      - '.github/workflows/neurio-release.yml'

concurrency:
  group: neurio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------- checks --
  checks:
    name: Typecheck, tests and bundles
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # The Electron binary is only needed for packaging; skip the download here.
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (server, permissions, uploads, voice, renderer)
        run: npm test

      - name: Build renderer, Electron main and the server bundle
        run: npm run build

      - name: Package the server (host it on any machine)
        run: |
          set -euo pipefail
          rm -rf release-server relay
          mkdir -p release-server relay
          cp -r dist-electron release-server/dist-electron
          cp package.json release-server/package.json
          cp README.md release-server/SERVER-README.md

          {
            printf '@echo off\r\n'
            printf 'rem Neurio server - run this on the machine that hosts your chat.\r\n'
            printf 'rem Requires Node.js 20.11+ from https://nodejs.org . Keep this window open.\r\n'
            printf 'setlocal\r\n'
            printf 'if "%%NEURIO_PORT%%"=="" set NEURIO_PORT=8790\r\n'
            printf 'if "%%NEURIO_DATA_DIR%%"=="" set NEURIO_DATA_DIR=%%~dp0data\r\n'
            printf 'echo.\r\n'
            printf 'echo   Neurio server on port %%NEURIO_PORT%% - data in %%NEURIO_DATA_DIR%%\r\n'
            printf 'echo   The first account you create becomes the server admin.\r\n'
            printf 'echo.\r\n'
            printf 'node "%%~dp0dist-electron\\\\server\\\\index.cjs" --host 0.0.0.0 --port %%NEURIO_PORT%% --data-dir "%%NEURIO_DATA_DIR%%" %%*\r\n'
            printf 'pause\r\n'
          } > release-server/start-server.cmd

          {
            printf '#!/usr/bin/env sh\n'
            printf '# Neurio server - run this on the machine that hosts your chat.\n'
            printf 'set -e\n'
            printf 'cd "$(dirname "$0")"\n'
            printf 'NEURIO_PORT="${NEURIO_PORT:-8790}"\n'
            printf 'NEURIO_DATA_DIR="${NEURIO_DATA_DIR:-$(pwd)/data}"\n'
            printf 'echo\n'
            printf 'echo "  Neurio server on port ${NEURIO_PORT} - data in ${NEURIO_DATA_DIR}"\n'
            printf 'echo "  The first account you create becomes the server admin."\n'
            printf 'echo\n'
            printf 'exec node dist-electron/server/index.cjs --host 0.0.0.0 --port "${NEURIO_PORT}" --data-dir "${NEURIO_DATA_DIR}" "$@"\n'
          } > release-server/start-server.sh
          chmod +x release-server/start-server.sh

          (cd release-server && zip -qr ../relay/neurio-server.zip .)
          (cd dist && zip -qr ../relay/neurio-web.zip .)
          ls -lh relay

      - uses: actions/upload-artifact@v4
        with:
          name: neurio-web
          path: |
            relay/neurio-web.zip
            relay/neurio-server.zip
          if-no-files-found: error

  # --------------------------------------------------------------- windows --
  windows:
    name: Windows EXE (installer + portable)
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (with the Electron binary)
        run: npm ci

      - name: Build renderer + Electron + server bundles
        run: npm run build

      - name: Generate icons
        run: npm run icons

      - name: Package with electron-builder (nsis + portable, x64)
        shell: pwsh
        env:
          # Unsigned build: no certificate, no secret, no signing service.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win --x64 --publish never *>&1 | Tee-Object -FilePath build-win.log
          if ($LASTEXITCODE -ne 0) { Write-Error "electron-builder exited with $LASTEXITCODE"; exit 1 }

      - name: List the produced installers
        shell: pwsh
        run: Get-ChildItem release -Filter *.exe | Select-Object Name, Length

      - name: Publish the build log as a commit comment
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "### Neurio Windows package log (\`${{ job.status }}\`)"
            echo
            echo '```'
            tail -c 30000 build-win.log 2>/dev/null | sed -e 's/```/~~~ /g' -e 's/\r$//' || echo '(no log)'
            echo '```'
          } > /tmp/comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@/tmp/comment.md || true

      - uses: actions/upload-artifact@v4
        with:
          name: neurio-windows
          path: |
            release/*.exe
            build-win.log
          if-no-files-found: error

  # --------------------------------------------------------------- android --
  android:
    name: Android APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build the renderer that gets bundled inside the APK
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm run icons
          npm run build:renderer

      - name: Validate the bundled UI before packaging
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo 'dist/index.html is missing'; exit 1; }
          grep -q 'src=' dist/index.html || { echo 'dist/index.html has no entry script'; exit 1; }
          ls -la dist dist/assets | head -20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile the debug and release APKs
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build-android.log

      - name: Verify the APKs contain the app UI and a signature
        run: |
          set -euo pipefail
          APK_DEBUG=android/app/build/outputs/apk/debug/app-debug.apk
          APK_RELEASE=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK_DEBUG"  || { echo 'debug APK missing'; exit 1; }
          test -f "$APK_RELEASE" || { echo 'release APK missing'; exit 1; }
          python3 - <<'PY'
          import zipfile, sys
          for path in ('android/app/build/outputs/apk/debug/app-debug.apk',
                       'android/app/build/outputs/apk/release/app-release.apk'):
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
                  needed = ['AndroidManifest.xml', 'classes.dex', 'assets/www/index.html']
                  missing = [n for n in needed if n not in names]
                  signed = [n for n in names if n.startswith('META-INF/') and n.endswith(('.RSA', '.DSA', '.EC'))]
                  if missing:
                      print(f'{path}: missing {missing}')
                      sys.exit(1)
                  if not signed:
                      print(f'{path}: no signature found')
                      sys.exit(1)
                  print(f'{path}: ok ({len(names)} entries, UI bundled, signature {signed[0]})')
          PY
          mkdir -p relay
          cp "$APK_DEBUG" relay/Neurio-Android-debug.apk
          cp "$APK_RELEASE" relay/Neurio-Android-1.0.0.apk
          ls -lh relay

      - name: Publish the build log as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "### Neurio Android build log (\`${{ job.status }}\`)"
            echo
            echo '```'
            tail -c 30000 build-android.log 2>/dev/null | sed -e 's/```/~~~ /g' -e 's/\r$//' || echo '(no log)'
            echo '```'
          } > /tmp/comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@/tmp/comment.md || true

      - uses: actions/upload-artifact@v4
        with:
          name: neurio-android
          path: |
            relay/*.apk
            build-android.log
          if-no-files-found: error

  # --------------------------------------------------------------- release --
  release:
    name: Publish download links
    needs: [checks, windows, android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect and rename artefacts
        id: collect
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p upload
          cp artifacts/*.exe upload/ 2>/dev/null || true
          cp artifacts/*.apk upload/ 2>/dev/null || true
          cp artifacts/neurio-web.zip "upload/neurio-web-${VERSION}.zip" 2>/dev/null || true
          cp artifacts/neurio-server.zip "upload/neurio-server-${VERSION}.zip" 2>/dev/null || true
          ls -lhR upload
          test -n "$(ls -A upload)" || { echo 'no artefacts were collected'; exit 1; }

      - name: Create or update the "neurio-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.collect.outputs.version }}"
          TAG="neurio-latest"
          REPO="${GITHUB_REPOSITORY}"

          {
            echo "## Neurio ${VERSION} — download"
            echo
            echo "| What | File | Notes |"
            echo "| --- | --- | --- |"
            echo "| **Windows (recommended)** | \`Neurio-Setup-${VERSION}.exe\` | Installer. Per-user install, no admin prompt. |"
            echo "| **Windows (portable)** | \`Neurio-Portable-${VERSION}.exe\` | No install — run it straight from a USB stick. |"
            echo "| **Android** | \`Neurio-Android-${VERSION}.apk\` | Install on the phone, allow \"install unknown apps\". |"
            echo "| **Server** | \`neurio-server-${VERSION}.zip\` | Run this on one machine (LAN or VPS) so several people share one chat. |"
            echo "| **Web UI** | \`neurio-web-${VERSION}.zip\` | Static UI to host on any web server; also installable as an app (PWA). |"
            echo
            echo "### First run"
            echo
            echo "1. Install the EXE (or the APK), or start the server bundle with \`start-server.cmd\` / \`start-server.sh\`."
            echo "2. In the app's sign-in screen keep the default address (\`http://127.0.0.1:8790\`) if that machine runs the server, or enter the server's address — e.g. \`http://192.168.1.20:8790\` on your Wi-Fi (the server prints it at startup)."
            echo "3. Create an account. The first account on a server becomes its admin."
            echo
            echo "Nothing here needs an API key, an account with any company, or a subscription. Text chat runs through the server you host; voice, video and screen sharing are peer-to-peer WebRTC between the participants."
            echo
            echo "### Honest notes"
            echo
            echo "- The EXE and the APK are **unsigned** (no paid certificate): Windows SmartScreen shows \"unknown publisher\" → *More info → Run anyway*; Android shows the usual warning for apps installed outside the Play Store."
            echo "- The APK bundles the UI inside the app and asks for the server address on first launch. Long-press anywhere to change it."
            echo "- Sharing over the internet needs one reachable machine (a VPS, a port forward, or a free Tailscale/WireGuard network) — see \`docs/NETWORKING.md\`."
            echo "- Cross-internet voice/video additionally wants your own STUN/TURN (\`coturn\` is free): \`NEURIO_ICE_SERVERS\`, documented in \`docs/SELF-HOSTING.md\`."
          } > notes.md

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --title "Neurio ${VERSION} — Windows EXE + Android APK" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "Neurio ${VERSION} — Windows EXE + Android APK" \
              --notes-file notes.md --latest
          fi

          gh release upload "$TAG" upload/* --repo "$REPO" --clobber

      - name: Print the download links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "### Download links"
            echo
            echo "- Release page: https://github.com/${GITHUB_REPOSITORY}/releases/tag/neurio-latest"
            echo "- Latest download page: https://github.com/${GITHUB_REPOSITORY}/releases/latest"
            echo
            echo "| File | Direct link |"
            echo "| --- | --- |"
            for asset in $(gh release view neurio-latest --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name'); do
              echo "| \`${asset}\` | https://github.com/${GITHUB_REPOSITORY}/releases/download/neurio-latest/${asset} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
