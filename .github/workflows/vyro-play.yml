name: VYRO PLAY Android build
on:
  push:
    branches: ["arena/ac979f8f-neurio"]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/vyro-play.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and unit tests
        run: |
          echo "SDK: ${ANDROID_HOME:-missing}; Java: $(java -version 2>&1 | head -1)"
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace > build.log 2>&1 || {
            tail -n 110 build.log
            grep -E '^e: |^\* What went wrong:|^> |FAILED|error:|^Caused by:' build.log | tail -n 35 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          tail -n 35 build.log
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/VYRO_PLAY.apk
          ls -lh output/VYRO_PLAY.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VYRO_PLAY
          path: output/VYRO_PLAY.apk
          if-no-files-found: error
