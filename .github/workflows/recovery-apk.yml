name: Build recovery APK
on:
  push:
    branches: [arena/6186214b-neurio]
    paths: ['android-recovery/**', '.github/workflows/recovery-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check Android SDK on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - name: Build debug APK
        working-directory: android-recovery
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: neurio-restore-apk
          path: android-recovery/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create neurio-restore-v1.0 android-recovery/app/build/outputs/apk/debug/app-debug.apk#neurio-restore.apk \
            --target "$GITHUB_SHA" --title 'Neurio Restore v1.0 (Android)' \
            --notes 'Scans accessible photos and videos and Android trash; cannot recover permanently erased internal storage.'
