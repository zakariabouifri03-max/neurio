name: MotionForge Studio - Windows packages

# Builds the downloadable Windows application and *tests it on Windows*:
#
#   1. the portable package (embedded CPython + Qt + FFmpeg + the app)
#   2. the single file setup (same payload, wizard, shortcuts, uninstaller)
#   3. a silent install on the runner, then the packaged app's own --selftest
#      from both the portable copy and the installed copy
#
# Successful runs publish both files to the release
# "motionforge-studio-1.0.0-win64".

on:
  push:
    branches:
      - arena/916a2551-neurio
      - main
    paths:
      - 'motionforge-studio/**'
      - '.github/workflows/motionforge-windows.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the packages to the GitHub release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: motionforge-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test on Windows
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: motionforge-studio-1.0.0-win64
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6-Essentials==6.11.2" pyinstaller

      - name: Cache downloads (wheels, CPython payload)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\mfs-cache
          key: mfs-win-cache-${{ runner.os }}-${{ hashFiles('motionforge-studio/tools/build_win.py', 'motionforge-studio/tools/build_win_installer.py', 'motionforge-studio/packaging/win/launcher/**') }}
          restore-keys: mfs-win-cache-${{ runner.os }}-

      - name: Build icon, portable package and installer
        working-directory: motionforge-studio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci | Out-Null
          python tools/make_icon.py *>&1 | Tee-Object -FilePath ci/build.log
          if ($LASTEXITCODE -ne 0) { throw "icon generation failed" }
          python tools/build_win.py --cache "${{ runner.temp }}\mfs-cache" --out dist *>&1 |
            Tee-Object -FilePath ci/build.log -Append
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Verify the produced binaries
        working-directory: motionforge-studio
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          $targets = @()
          $tree = Join-Path "${{ runner.temp }}" "mfs-cache\tree\MotionForge Studio"
          if (Test-Path $tree) { $targets += $tree }
          $targets += (Get-ChildItem dist/*.zip).FullName
          $targets += (Get-ChildItem dist/*.exe).FullName
          "verifying: $($targets -join ', ')"
          python tools/verify_win.py @targets *>&1 | Tee-Object -FilePath ci/build.log -Append
          if ($LASTEXITCODE -ne 0) { throw "verification failed" }

      - name: Unpack and smoke test the portable build
        working-directory: motionforge-studio
        timeout-minutes: 20
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist/*portable*.zip | Select-Object -First 1).FullName
          if (-not $zip) { throw "no portable package was built" }
          & tools/ci_portable_smoke.ps1 -Zip $zip
          if ($LASTEXITCODE -ne 0) { throw "portable smoke test failed ($LASTEXITCODE)" }

      - name: Silent install on the runner, then test the installed app
        working-directory: motionforge-studio
        timeout-minutes: 20
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/*Setup*.exe | Select-Object -First 1).FullName
          if (-not $setup) { throw "no installer was built" }
          & tools/ci_install_test.ps1 -Setup $setup
          if ($LASTEXITCODE -ne 0) { throw "install test failed ($LASTEXITCODE)" }

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: MotionForge-Studio-1.0.0-win64
          path: |
            motionforge-studio/dist/*.zip
            motionforge-studio/dist/*.exe
            motionforge-studio/dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Report a failure (ci-reports branch)
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path motionforge-studio/ci | Out-Null
          $out = @()
          $out += "MotionForge Studio - CI failure report"
          $out += ""
          $out += "run:    $env:GITHUB_RUN_ID"
          $out += "commit: $env:GITHUB_SHA"
          $out += "ref:    $env:GITHUB_REF"
          $out += ""
          foreach ($f in (Get-ChildItem motionforge-studio/ci/*.log | Select-Object -ExpandProperty FullName)) {
            $out += "===== $f ====="
            if (Test-Path $f) { $out += (Get-Content $f -Raw) } else { $out += "(missing)" }
            $out += ""
          }
          ($out -join "`n") | Out-File -Encoding utf8 motionforge-studio/ci/report.md
          git config user.email "ci@motionforge.local"
          git config user.name "MotionForge CI"
          git add motionforge-studio/ci/report.md
          git commit -q -m "CI failure report for $env:GITHUB_SHA" || Write-Host "nothing to commit"
          git push --force origin "HEAD:refs/heads/ci-reports"

      - name: Publish to the GitHub release
        if: github.event_name == 'push' || inputs.publish
        working-directory: motionforge-studio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" `
              --title "MotionForge Studio 1.0.0 - Windows x64" `
              --notes-file packaging/win/RELEASE_NOTES.md
          }
          gh release upload "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --clobber dist/*.zip dist/*.exe
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY"
        shell: pwsh
