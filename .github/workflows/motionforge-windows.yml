name: MotionForge Studio - Windows packages

# Builds the downloadable Windows application and *tests it on Windows*:
#
#   1. the portable package (embedded CPython + Qt + FFmpeg + the app)
#   2. the single file setup (same payload, wizard, shortcuts, uninstaller)
#   3. a silent install on the runner, then the packaged app's own --selftest
#      from both the portable copy and the installed copy
#
# Successful runs publish both files to the release
# "motionforge-studio-1.0.0-win64".

on:
  push:
    branches:
      - arena/916a2551-neurio
      - main
    paths:
      - 'motionforge-studio/**'
      - '.github/workflows/motionforge-windows.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the packages to the GitHub release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: motionforge-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test on Windows
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: motionforge-studio-1.0.0-win64
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6-Essentials==6.11.2" pyinstaller

      - name: Cache downloads (wheels, CPython payload)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\mfs-cache
          key: mfs-win-cache-${{ runner.os }}-${{ hashFiles('motionforge-studio/tools/build_win.py', 'motionforge-studio/tools/build_win_installer.py') }}
          restore-keys: mfs-win-cache-${{ runner.os }}-

      - name: Build icon, portable package and installer
        working-directory: motionforge-studio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci | Out-Null
          python tools/make_icon.py *>&1 | Tee-Object -FilePath ci/build.log
          if ($LASTEXITCODE -ne 0) { throw "icon generation failed" }
          python tools/build_win.py --cache "${{ runner.temp }}\mfs-cache" --out dist *>&1 |
            Tee-Object -FilePath ci/build.log -Append
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Verify the produced binaries
        working-directory: motionforge-studio
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          $targets = @()
          $tree = Join-Path "${{ runner.temp }}" "mfs-cache\tree\MotionForge Studio"
          if (Test-Path $tree) { $targets += $tree }
          $targets += (Get-ChildItem dist/*.zip).FullName
          $targets += (Get-ChildItem dist/*.exe).FullName
          "verifying: $($targets -join ', ')"
          python tools/verify_win.py @targets *>&1 | Tee-Object -FilePath ci/build.log -Append
          if ($LASTEXITCODE -ne 0) { throw "verification failed" }

      - name: Unpack and smoke test the portable build
        shell: pwsh
        run: |
          $portable = Join-Path "${{ runner.temp }}" "portable"
          Expand-Archive -Path motionforge-studio/dist/*portable*.zip -DestinationPath $portable -Force
          $app = Join-Path $portable "MotionForge Studio"
          "== console twin --selftest"
          & (Join-Path $app "MotionForge console.exe") --selftest
          if ($LASTEXITCODE -ne 0) { throw "portable self test failed ($LASTEXITCODE)" }
          "== gui exe --selftest"
          & (Join-Path $app "MotionForge Studio.exe") --selftest 2>&1 | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { throw "portable GUI self test failed ($LASTEXITCODE)" }
          "== version resource"
          (Get-Item (Join-Path $app "MotionForge Studio.exe")).VersionInfo | Format-List ProductName,FileVersion,CompanyName

      - name: Silent install on the runner, then test the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem motionforge-studio/dist/*Setup*.exe | Select-Object -First 1
          $dir = Join-Path "${{ runner.temp }}" "mfstest"
          "== installing to $dir"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList @('/silent', '/dir', "`"$dir`"") -PassThru -Wait
          "installer exit code: $($p.ExitCode)"
          Get-Content "$env:TEMP\motionforge-setup.log" -Tail 40
          if (-not (Test-Path (Join-Path $dir "MotionForge Studio.exe"))) { throw "install produced no application" }
          "== installed app self test"
          & (Join-Path $dir "MotionForge console.exe") --selftest
          if ($LASTEXITCODE -ne 0) { throw "installed app self test failed ($LASTEXITCODE)" }
          "== shortcuts and uninstall entry"
          Get-ChildItem (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\MotionForge Studio") |
            Format-Table Name
          $keys = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall"
          $keys | Where-Object { $_.PSChildName -like "*MotionForge*" } | Select-Object PSChildName
          "== uninstall"
          $un = Join-Path $dir "Uninstall.exe"
          $u = Start-Process -FilePath $un -ArgumentList @('--uninstall', '--silent', '--dir', "`"$dir`"") -PassThru -Wait
          "uninstaller exit code: $($u.ExitCode)"
          Start-Sleep -Seconds 4
          if (Test-Path (Join-Path $dir "MotionForge Studio.exe")) { throw "uninstall left files behind" }
          "uninstall cleaned up"

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: MotionForge-Studio-1.0.0-win64
          path: |
            motionforge-studio/dist/*.zip
            motionforge-studio/dist/*.exe
            motionforge-studio/dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Report a failure on the commit
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $log = ""
          if (Test-Path motionforge-studio/ci/build.log) {
            $log = Get-Content motionforge-studio/ci/build.log -Raw
            if ($log.Length -gt 12000) { $log = $log.Substring($log.Length - 12000) }
          }
          $body = "MotionForge Windows build failed on run $env:GITHUB_RUN_ID.`n`n```text`n$log`n```"
          $body | Out-File -Encoding utf8 ci-failure.md
          gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/comments" -F body=@ci-failure.md

      - name: Publish to the GitHub release
        if: github.event_name == 'push' || inputs.publish
        working-directory: motionforge-studio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" `
              --title "MotionForge Studio 1.0.0 - Windows x64" `
              --notes-file packaging/win/RELEASE_NOTES.md
          }
          gh release upload "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --clobber dist/*.zip dist/*.exe
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY"
        shell: pwsh
