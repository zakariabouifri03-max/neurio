name: MotionForge Studio - Windows packages

# Builds the downloadable Windows application (portable zip + single file
# installer) on Linux, verifies the produced binaries and publishes them to the
# GitHub release "motionforge-studio-1.0.0-win64".

on:
  push:
    branches:
      - arena/916a2551-neurio
      - main
    paths:
      - 'motionforge-studio/**'
      - '.github/workflows/motionforge-windows.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the packages to the release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: motionforge-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build portable + installer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: motionforge-studio-1.0.0-win64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6-Essentials==6.11.2"
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Cache downloads (wheels, CPython payload)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mfs-cache
          key: mfs-win-cache-${{ hashFiles('motionforge-studio/tools/build_win.py', 'motionforge-studio/tools/build_win_installer.py') }}
          restore-keys: mfs-win-cache-

      - name: Build the Windows packages
        working-directory: motionforge-studio
        run: |
          python tools/make_icon.py
          python tools/build_win.py --cache "$RUNNER_TEMP/mfs-cache" --out dist

      - name: Verify the produced binaries
        working-directory: motionforge-studio
        run: |
          ls -la dist
          python tools/verify_win.py dist/*.zip dist/*.exe

      - name: Show what was built
        working-directory: motionforge-studio
        run: cat dist/BUILD-INFO.txt

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: MotionForge-Studio-1.0.0-win64
          path: |
            motionforge-studio/dist/*.zip
            motionforge-studio/dist/*.exe
            motionforge-studio/dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.publish || github.event_name == 'push'
        working-directory: motionforge-studio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MotionForge Studio 1.0.0 — Windows x64" \
              --notes-file packaging/win/RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/*.zip dist/*.exe
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
