name: TurboLoad Pro — Windows x64

on:
  workflow_dispatch:
  push:
    paths:
      - 'TurboLoadPro/**'
      - '.github/workflows/turboloadpro-windows.yml'

jobs:
  test-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test .\TurboLoadPro\TurboLoadPro.sln -c Release
      - name: Publish self-contained x64 app
        run: >-
          dotnet publish .\TurboLoadPro\src\TurboLoadPro.App\TurboLoadPro.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -o .\TurboLoadPro\artifacts\publish\win-x64
      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: TurboLoadPro-win-x64
          path: .\TurboLoadPro\artifacts\publish\win-x64\TurboLoadPro.exe
          if-no-files-found: error
