name: ANIMAI STUDIO Windows

on:
  workflow_dispatch:
  push:
    branches:
      - arena/d15f1de3-neurio
    paths:
      - "animai-studio/**"
      - ".github/workflows/animai-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: animai-studio
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: animai-studio/package-lock.json

      - name: Install
        run: npm ci

      - name: Build renderer
        run: npx vite build

      - name: Package Windows exe
        shell: pwsh
        run: |
          $out = npx electron-builder --win --publish never 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $tail = if ($out.Length -gt 2800) { $out.Substring($out.Length - 2800) } else { $out }
            $tail = $tail -replace "`r"," " -replace "`n"," | "
            Write-Host "::error::electron-builder failed: $tail"
            exit 1
          }

      - name: List output
        if: always()
        run: Get-ChildItem -Recurse release | Select-Object FullName, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ANIMAI-STUDIO-windows
          if-no-files-found: error
          path: |
            animai-studio/release/**/*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: animai-studio-v1.0.0
          name: ANIMAI STUDIO 1.0.0
          body: |
            Download ANIMAI STUDIO for Windows:

            - **ANIMAI-STUDIO.exe** — portable (no install)
            - **ANIMAI-STUDIO-Setup.exe** — installer

            If Windows SmartScreen warns, choose More info → Run anyway (unsigned build).
          files: animai-studio/release/**/*.exe
          make_latest: true
