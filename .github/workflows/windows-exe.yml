name: Build Neurio Studio Windows installer

on:
  push:
    branches:
      - arena/65e7f515-neurio
    paths:
      - 'electron/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'package.json'
      - 'package-lock.json'
      - 'src/editor.css'
      - 'src/editor/**'
      - 'sw.js'
      - 'icons/**'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build Windows x64 installer
        run: npm run dist:win
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neurio-Studio-Windows-x64-${{ github.run_id }}
          path: dist-electron/Neurio-Studio-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: build-installer
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: Neurio-Studio-Windows-x64-${{ github.run_id }}
          path: release-assets
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neurio-studio-0.1.0-${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          name: Neurio Studio 0.1.0 — Windows x64
          body: |
            Windows x64 installer generated from the Neurio Studio source on this branch.

            This desktop package runs the local-first editor on your computer. Media files and projects remain on your device. The app does not include hosted AI models or claim MP4/MOV export; browser-based WebM export is available inside the editor.

            This is an unsigned prerelease build. Windows SmartScreen may show an unknown-publisher warning.
          prerelease: true
          make_latest: false
          files: release-assets/Neurio-Studio-Windows-x64-Setup.exe
