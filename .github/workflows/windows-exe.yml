name: Build AI Download Manager Pro EXE

on:
  push:
    branches:
      - arena/5c878a1a-neurio
    paths:
      - '.github/workflows/windows-exe.yml'
      - 'assets/**'
      - 'browser-bridge/**'
      - 'desktop/**'
      - 'electron/**'
      - 'engine/**'
      - 'installer/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-portable:
    name: Build portable Windows x64 EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pushed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build the Windows portable executable
        run: npm run build:win:portable

      - name: Verify the executable artifact
        shell: pwsh
        run: |
          $exe = Get-Item 'release/AI-Download-Manager-Pro.exe'
          if ($exe.Length -lt 50MB) { throw "Unexpectedly small EXE ($($exe.Length) bytes)." }
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List
          Write-Output "Built $($exe.FullName) ($($exe.Length) bytes)."

      - name: Upload portable Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: AI-Download-Manager-Pro-Windows-x64
          path: release/AI-Download-Manager-Pro.exe
          if-no-files-found: error
          retention-days: 30
