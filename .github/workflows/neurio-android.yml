name: Build Neurio Android APK
on:
  push:
    branches: [arena/baee465c-neurio]
    paths:
      - "android/**"
      - "src/neurio.*"
      - "index.html"
      - "assets/**"
      - "icons/neurio-*"
      - "manifest.webmanifest"
      - ".github/workflows/neurio-android.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build and verify preview APK
        run: bash android/build.sh
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Neurio-Android-preview
          path: |
            android/out/Neurio-0.1.0-preview.apk
            android/out/Neurio-0.1.0-preview.apk.sha256
            android/out/package-info.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct-download preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          TAG=neurio-android-v0.1.0-preview
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "This version is already published; leaving its assets unchanged."
          else
            gh release create "$TAG" \
              android/out/Neurio-0.1.0-preview.apk \
              android/out/Neurio-0.1.0-preview.apk.sha256 \
              android/out/package-info.txt \
              --target "$COMMIT" --prerelease --latest=false \
              --title "Neurio Android 0.1.0 — Preview APK" \
              --notes-file android/RELEASE-NOTES.md
          fi
