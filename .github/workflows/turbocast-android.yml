name: TurboCast 60 Android APK

on:
  push:
    branches:
      - arena/e04e554f-neurio
    paths:
      - "android/**"
      - ".github/workflows/turbocast-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build and test debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/gradle/wrapper/gradle-wrapper.properties
            android/gradle.properties
            android/**/*.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests and assemble debug APK
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee gradle-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            {
              echo '### Gradle failure details'
              echo '```text'
              tail -n 80 gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            details=$(tail -n 80 gradle-build.log)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Gradle failure details::$details"
            exit "$result"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: turbocast60-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
