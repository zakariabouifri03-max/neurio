name: NovaCut Windows x64

on:
  push:
    branches:
      - arena/9b2bcf11-neurio
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test, and package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Build, test, and smoke-test the Windows app
        shell: pwsh
        run: |
          $Log = Join-Path $env:RUNNER_TEMP "novacut-build.log"
          $ExitCode = 0
          try {
            & .\build_windows.ps1 *>&1 | Tee-Object -FilePath $Log
            if ($LASTEXITCODE -ne 0) { $ExitCode = $LASTEXITCODE }
          } catch {
            $_ | Out-String | Add-Content -Path $Log
            $ExitCode = 1
          }
          if ($ExitCode -ne 0) {
            $Tail = (Get-Content $Log | Select-Object -Last 30) -join " | "
            $Tail = $Tail -replace '[\r\n]+', ' '
            if ($Tail.Length -gt 3000) { $Tail = $Tail.Substring($Tail.Length - 3000) }
            Write-Output "::error title=NovaCut Windows build failed::$Tail"
            Get-Content $Log | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            exit $ExitCode
          }

      - name: Preserve Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NovaCut-Windows-build-log
          path: ${{ runner.temp }}/novacut-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Create portable download archive and checksum
        shell: pwsh
        run: |
          $AppFolder = Join-Path $PWD "dist\NovaCut AI Studio"
          $ZipPath = Join-Path $PWD "dist\NovaCut-AI-Studio-Windows-x64.zip"
          Compress-Archive -Path (Join-Path $AppFolder "*") -DestinationPath $ZipPath -CompressionLevel Optimal
          $Hash = (Get-FileHash -Path $ZipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  NovaCut-AI-Studio-Windows-x64.zip" | Set-Content -Path "$ZipPath.sha256" -Encoding ascii

      - name: Upload CI download artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaCut-AI-Studio-Windows-x64
          path: |
            dist/NovaCut-AI-Studio-Windows-x64.zip
            dist/NovaCut-AI-Studio-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish preview release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[novacut-release]')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: pwsh
        run: |
          $Tag = "novacut-ai-studio-windows-preview-$env:RUN_NUMBER"
          $Notes = @"
          NovaCut AI Studio Windows x64 portable preview.

          This build passed the automated test suite and a packaged-app startup smoke test on a GitHub-hosted Windows runner. It has not had manual playback testing across Windows devices.

          FFmpeg is not bundled. Install a legally obtained FFmpeg build and configure it in File > FFmpeg / AI Paths. Optional AI models are not included and are never downloaded automatically.
          "@
          gh release create $Tag `
            "dist/NovaCut-AI-Studio-Windows-x64.zip" `
            "dist/NovaCut-AI-Studio-Windows-x64.zip.sha256" `
            --title "NovaCut AI Studio Windows x64 preview $env:RUN_NUMBER" `
            --notes $Notes `
            --prerelease
