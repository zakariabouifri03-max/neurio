name: Publish Neurio Studio

on:
  push:
    branches:
      - arena/5305cc0b-neurio
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the app
        uses: actions/checkout@v4

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare the static app
        run: |
          mkdir -p _site/src _site/icons
          cp index.html manifest.webmanifest sw.js _site/
          cp src/main.js src/style.css src/image-worker.js _site/src/
          cp icons/neurio.svg icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png _site/icons/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
