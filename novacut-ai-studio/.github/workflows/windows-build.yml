name: Windows build

on:
  push:
    branches: ["**"]
    paths:
      - "novacut-ai-studio/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "novacut-ai-studio/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: novacut-ai-studio

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: novacut-ai-studio/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Download FFmpeg (essentials, static)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/bin | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials-win64-static.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg-extract
          Copy-Item ffmpeg-extract/*/bin/ffmpeg.exe installer/bin/
          Copy-Item ffmpeg-extract/*/bin/ffprobe.exe installer/bin/

      - name: Test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -q

      - name: PyInstaller build
        run: pyinstaller --noconfirm installer/novacut.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer/novacut.iss

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/NovaCutAIStudio/* -DestinationPath NovaCutAIStudio-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NovaCut-Setup
          path: novacut-ai-studio/installer/Output/NovaCutSetup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: NovaCutAIStudio-portable
          path: novacut-ai-studio/NovaCutAIStudio-portable.zip
          if-no-files-found: error
