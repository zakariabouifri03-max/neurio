name: Tests

on:
  push:
    paths:
      - "novacut-ai-studio/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "novacut-ai-studio/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: novacut-ai-studio

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: novacut-ai-studio/requirements-dev.txt
      - name: Linux media libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libdbus-1-3 libxkbcommon0 libfontconfig1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -q
