[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novacut-ai-studio"
version = "1.0.0"
description = "NovaCut AI Studio - professional offline video editor with local AI for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "NovaCut AI Studio contributors" }]

[tool.setuptools.packages.find]
include = ["novacut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
