[project]
name = "anywear-ai"
version = "0.1.0"
description = "Modular AI Virtual Try-On engine for Anywear AI (IDM-VTON / CatVTON / dev composite providers)"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anywear_ai*"]
