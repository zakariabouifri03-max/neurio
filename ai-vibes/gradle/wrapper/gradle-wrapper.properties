# Gradle distribution used by Android Studio / the wrapper.
#
# NOTE: gradle-wrapper.jar (binary) is intentionally not committed. If Android
# Studio asks for it, run once:
#     ./gradlew wrapper --gradle-version 8.9
# (the committed ./gradlew bootstraps Gradle itself, so the command works on a
# fresh clone as long as the machine has network access).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
