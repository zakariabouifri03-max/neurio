; ============================================================================
;  GameProject - DefaultEngine.ini
;  Phase 01: open-world + World Partition + voxel foundation defaults.
;  Everything here is intentionally conservative: it must open with zero
;  warnings on a stock UE5 install and must not bake in decisions that
;  Phase 02 (real voxel engine) would have to undo.
; ============================================================================

[/Script/EngineSettings.GameMapsSettings]
; Template_Default always ships with the engine, so a fresh clone of this repo
; opens into a valid, empty, playable level. Tools/EditorScripts/bootstrap_project.py
; rewrites these two lines to /Game/Maps/L_TestWorld once the real test map exists.
EditorStartupMap=/Engine/Maps/Templates/Template_Default.Template_Default
GameDefaultMap=/Engine/Maps/Templates/Template_Default.Template_Default
TransitionMap=None
ServerDefaultMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/ProjectCore.GameProjectGameMode
GameInstanceClass=/Script/ProjectCore.GameProjectGameInstance
bUseSplitscreen=False
bOffsetPlayerGamepadIds=False

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/ProjectCore")
+ActiveGameNameRedirects=(OldGameName="/Script/TP_Blank",NewGameName="/Script/ProjectCore")
; Time between garbage collection passes. A streamed world churns through a lot of
; transient chunk/instance data, so collect a little more aggressively than default.
gc.TimeBetweenPurgingPendingKillObjects=30.0
bUseFixedFrameRate=False

[/Script/Engine.GarbageCollectionSettings]
gc.MaxObjectsInEditor=25165824
gc.MaxObjectsInGame=2097152
gc.NumRetriesBeforeForcingGC=10

; ---------------------------------------------------------------------------
; World Partition
; ---------------------------------------------------------------------------
[/Script/WorldPartitionEditor.WorldPartitionEditorSettings]
bEnableWorldPartition=True
bEnableConversionPrompt=False
CommandletClass=Class'/Script/UnrealEd.WorldPartitionConvertCommandlet'

; Runtime spatial hash defaults for *new* World Partition maps. Per-map grids
; still live on the map's UWorldPartition asset and win over these values.
; Cell size / loading range are tuned for a large, drivable open world:
; bigger cells = fewer actors to manage, smaller cells = finer streaming.
[/Script/Engine.WorldPartitionRuntimeSpatialHash]
bEnableStreaming=True

; Console-side tuning for the streaming pipeline (applies to WP + level streaming).
[/Script/Engine.StreamingSettings]
s.AsyncLoadingThreadEnabled=True
s.AsyncLoadingTimeLimit=5.0
s.LevelStreamingActorsUpdateTimeLimit=5.0
s.LevelStreamingComponentsRegistrationGranularity=10
s.UnregisterComponentsTimeLimit=3.0
s.MaxPackageSummarySize=16384
s.FlushStreamingOnExit=True
+FixedBootOrder=/Script/Engine/Default__SoundBase
+FixedBootOrder=/Script/Engine/Default__MaterialInterface
+FixedBootOrder=/Script/Engine/Default__DeviceProfileManager

; ---------------------------------------------------------------------------
; Renderer - detailed voxel look: strong silhouettes + high quality lighting.
; Lumen GI + Lumen reflections + VSM. Nanite is left at engine default because
; Phase 01 voxel geometry is instanced boxes (Nanite-friendly later, not now).
; ---------------------------------------------------------------------------
[/Script/Engine.RendererSettings]
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=1
r.AntiAliasingMethod=2
r.DefaultFeature.MotionBlur=True
r.VirtualTextures=True
r.VirtualTexturedLightmaps=True
r.TextureStreaming=True

