<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مونتاج برو — Montaj Pro</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<meta name="description" content="محرر فيديو احترافي في المتصفح — بلا إنترنت، بلا رفع، كل المعالجة في جهازك.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="ui.css">
<!--FONTS-->
</head>
<body>
<div id="splash">
  <div class="splash-inner">
    <div class="logo-mark">🎬</div>
    <h1>مونتاج برو</h1>
    <p>محرر فيديو احترافي — بلا إنترنت</p>
    <div class="spinner"></div>
  </div>
</div>

<div id="app">
  <header id="topbar">
    <div class="brand"><span class="logo-mark small">🎬</span><b>مونتاج برو</b></div>
    <div class="spacer"></div>
    <button class="ibtn" id="btn-undo" title="تراجع"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 14H5V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10l4-4M5 10c3-4 8-5 11-3s4 6 2 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="ibtn" id="btn-redo" title="إعادة"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 14h4v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 10l-4-4M19 10c-3-4-8-5-11-3s-4 6-2 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="ibtn" id="btn-save" title="حفظ"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 4h11l3 3v13H5z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 4v6h7V4M8 20v-6h8v6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    <button class="ibtn" id="btn-projects" title="المشاريع"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 7h6l2 2h10v10H3z" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    <button class="ibtn hide-sm" id="btn-full" title="شاشة كاملة"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="btn primary" id="btn-export">⬆ تصدير</button>
  </header>

  <main id="stage">
    <aside id="rail">
      <button class="rail-btn active" data-tab="media"><span>🎞</span><i>الوسائط</i></button>
      <button class="rail-btn" data-tab="audio"><span>🎵</span><i>الصوت</i></button>
      <button class="rail-btn" data-tab="text"><span>🅣</span><i>نص</i></button>
      <button class="rail-btn" data-tab="stickers"><span>😀</span><i>ملصقات</i></button>
      <button class="rail-btn" data-tab="effects"><span>✨</span><i>تأثيرات</i></button>
      <button class="rail-btn" data-tab="motion"><span>🎯</span><i>حركة</i></button>
      <button class="rail-btn" data-tab="speed"><span>⏩</span><i>سرعة</i></button>
      <button class="rail-btn" data-tab="captions"><span>💬</span><i>ترجمة</i></button>
      <button class="rail-btn" data-tab="export"><span>⬆</span><i>تصدير</i></button>
    </aside>

    <section id="preview-col">
      <div id="preview-wrap">
        <canvas id="preview-canvas"></canvas>
        <div id="preview-overlays"></div>
        <div id="clip-box">
          <span class="hb nw"></span><span class="hb ne"></span><span class="hb sw"></span><span class="hb se"></span><span class="hb rot"></span>
        </div>
      </div>
      <div id="transport">
        <button class="ibtn" id="btn-split" title="تقسيم">✂</button>
        <button class="ibtn big" id="btn-play" title="تشغيل"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M8 5l12 7-12 7z" fill="currentColor"/></svg></button>
        <span id="time-display" class="time">00:00:00</span>
        <div class="spacer"></div>
        <button class="ibtn hide-sm" id="btn-zoom-out" title="تصغير">−</button>
        <button class="ibtn hide-sm" id="btn-zoom-fit" title="ملاءمة">⤢</button>
        <button class="ibtn hide-sm" id="btn-zoom-in" title="تكبير">＋</button>
      </div>
    </section>

    <aside id="sheet">
      <div id="sheet-head">
        <b id="sheet-title">الوسائط</b>
        <button class="ibtn" id="sheet-close">✕</button>
      </div>
      <div id="inspector"></div>
    </aside>
  </main>

  <section id="timeline">
    <div id="tl-toolbar">
      <button class="mini" id="btn-add-overlay-track" title="مسار تراكب">+ مسار</button>
      <button class="mini" id="btn-add-video-track" title="مسار فيديو">+ فيديو</button>
      <button class="mini" id="btn-add-audio-track" title="مسار صوت">+ صوت</button>
      <div class="spacer"></div>
      <span class="hint-inline">اسحب المقاطع • اضغط مرتين للتحرير</span>
    </div>
    <div id="tl-main">
      <div id="tl-headers"></div>
      <div id="tl-scroll">
        <div id="tl-ruler"></div>
        <div id="tl-head">
          <div class="tl-head-bubble">00:00:00</div>
          <div class="tl-head-line"></div>
        </div>
        <div id="tl-lanes"></div>
      </div>
    </div>
  </section>
</div>

<nav id="tabbar">
  <button class="tabbar-btn active" data-tab="media"><span>🎞</span><i>وسائط</i></button>
  <button class="tabbar-btn" data-tab="effects"><span>✨</span><i>تأثيرات</i></button>
  <button class="tabbar-btn" data-tab="text"><span>🅣</span><i>نص</i></button>
  <button class="tabbar-btn" data-tab="audio"><span>🎵</span><i>صوت</i></button>
  <button class="tabbar-btn" data-tab="motion"><span>🎯</span><i>حركة</i></button>
  <button class="tabbar-btn" data-tab="export"><span>⬆</span><i>تصدير</i></button>
</nav>

<dialog id="modal-export">
  <h3>تصدير الفيديو</h3>
  <div id="exp-info" class="hint"></div>
  <div class="exp-row"><span>محرك التصدير</span><b id="exp-engine">—</b></div>
  <div class="progress"><div id="exp-bar"></div></div>
  <div id="exp-status" class="hint">جاهز</div>
  <div id="exp-log" class="hint dim"></div>
  <div class="dlg-actions">
    <button class="btn" onclick="document.getElementById('modal-export').close()">إغلاق</button>
    <button class="btn" id="exp-cancel">إلغاء</button>
    <button class="btn primary" onclick="document.getElementById('modal-export').close();window.__app.openExportModal(true)">تصدير</button>
  </div>
</dialog>

<dialog id="modal-projects">
  <h3>المشاريع</h3>
  <div id="projects-list"></div>
  <div class="dlg-actions">
    <button class="btn" onclick="document.getElementById('modal-projects').close()">إغلاق</button>
    <button class="btn primary" onclick="document.getElementById('modal-projects').close();window.__app.newProjectFlow()">مشروع جديد</button>
  </div>
</dialog>

<div id="ctx-menu"></div>
<div id="toast"></div>
<div id="dropzone"><div>أفلت الملفات هنا 📥</div></div>
<script src="bundle.js"></script>
</body>
</html>
