plugins {
    id 'com.android.application'
}

android {
    namespace 'com.neurio.nourstudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.neurio.nourstudio'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
