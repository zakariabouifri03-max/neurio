<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>IRONVOW smoke</title>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/"}}</script>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<script type="module">
import * as THREE from 'three';
import { Arena } from '../src/arena.js';
import { Rig } from '../src/characters.js';
import { buildWeapon, buildShield } from '../src/weapons.js';
import { BodyState, WeaponBody, sweepBody, resolveStrike } from '../src/combat.js';
import { harnessById, weaponById, shieldById } from '../src/data.js';
import { handFrame } from '../src/moves.js';

const errors = [];
window.onerror = (e) => errors.push(String(e.message || e));
window.__log = [];

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const arenaId = new URLSearchParams(location.search).get('arena') || 'hall';
const arena = new Arena(arenaId);
scene.add(arena.group);
if (arena.scene.fog) scene.fog = arena.scene.fog;
scene.background = new THREE.Color(arena.def.id === 'courtyard' ? 0x8fb4dd : 0x0a0c10);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.06, 260);
camera.position.set(0, 1.63, 4.2);
camera.lookAt(0, 1.3, -2);

// two fighters facing off
const cfgs = [
  { harness: harnessById('halfplate'), weapon: 'longsword', shield: 'none', house: 'rookmoor', pos: [-0.6, 0, -1.4], facing: 0 },
  { harness: harnessById('gambeson'), weapon: 'arming', shield: 'kite', house: 'ashcombe', pos: [0.7, 0, 1.2], facing: Math.PI },
];
const rigs = [];
for (const c of cfgs) {
  const rig = new Rig({
    height: 1.78, build: 0.98, skin: 0xd2ab84, hair: 0x3a2e22, hairStyle: 'mane', beard: 2,
    cloth: [60, 52, 66], accent: [140, 40, 34], harness: c.harness, hollow: false,
  });
  rig.root.position.set(c.pos[0], c.pos[1], c.pos[2]);
  rig.root.rotation.y = c.facing;
  scene.add(rig.root);
  const wdef = weaponById(c.weapon);
  const wmesh = buildWeapon(wdef);
  rig.grip.R.add(wmesh);
  const wb = new WeaponBody(wmesh, wdef);
  wb.owner = rig;
  const sdef = shieldById(c.shield);
  let sb = null;
  if (sdef && sdef.model) {
    const smesh = buildShield(sdef, c.house, c.harness.color);
    smesh.rotation.set(-Math.PI / 2, 0, 0);
    smesh.position.set(0, 0.06, -0.02);
    rig.grip.L.add(smesh);
    sb = new WeaponBody(smesh, sdef, true);
    sb.owner = rig;
  }
  rigs.push({ rig, wb, sb, skill: c.skill });
  window.__log.push(`rig built: ${c.weapon} verts=${countVerts(wmesh)}`);
}
function countVerts(o) { let n = 0; o.traverse((c) => { if (c.isMesh) n += c.geometry.attributes.position?.count || 0; }); return n; }

// pose the front fighter into a guard, the back one into a mid-cut
const q = new THREE.Quaternion();
const poseArm = (rig, side, hand, blade, edge, pole) => {
  handFrame(blade, edge, q);
  rig.solveArm(side, hand, pole, q);
};
const A = rigs[0], B = rigs[1];
A.rig.root.updateWorldMatrix(true, true);
poseArm(A.rig, 'R', new THREE.Vector3(0.30, -0.30, -0.36).applyMatrix4(new THREE.Matrix4().makeTranslation(0,0,0)).add(A.rig.root.position.clone().setY(1.63)).setZ(A.rig.root.position.z - 0.36), new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 1), new THREE.Vector3(0.6, -0.4, 0.4));
A.rig.solveArm('L', new THREE.Vector3(-0.16, 1.43, -0.42), new THREE.Vector3(-1, -0.4, 0.3), null);
B.rig.solveArm('R', new THREE.Vector3(0.1, 1.4, 0.9), new THREE.Vector3(0.7, -0.4, 0.3), null);

const t0 = performance.now();
renderer.render(scene, camera);
const renderMs = performance.now() - t0;

// one physics probe: sweep the swinging weapon against the other fighter's volumes
A.rig.updateVolumes();
B.rig.updateVolumes();
A.wb.sample();
const hit = sweepBody(A.wb, B.rig.volumes, 1 / 60, { ignore: () => false });

window.__result = {
  errors,
  arena: arena.def.id,
  colliders: arena.colliders.length,
  torches: arena.torches.length,
  volumesA: A.rig.volumes.length,
  volumesB: B.rig.volumes.length,
  segsA: A.wb.segs.length,
  gapWorld: A.rig.gapWorld().map((v) => [+v.x.toFixed(2), +v.y.toFixed(2), +v.z.toFixed(2)]),
  renderMs: +renderMs.toFixed(1),
  hit: hit ? { region: hit.region, strike: hit.strike, joules: +hit.joules.toFixed(1), speed: +hit.speed.toFixed(1) } : null,
  log: window.__log,
  tris: renderer.info.render.triangles,
  calls: renderer.info.render.calls,
};
window.__ready = true;
</script>
</body></html>
