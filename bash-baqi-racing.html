<style>
/* ═══ Bash Baqi Racing — UI ═══ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  background: #0b1035;
  color: #fff;
  user-select: none;
  touch-action: manipulation;
  overscroll-behavior: none;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
#app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* ── error overlay ── */
#errLog {
  display: none; position: fixed; left: 8px; bottom: 8px; z-index: 999;
  background: rgba(200, 30, 30, 0.92); color: #fff; padding: 8px 12px;
  border-radius: 10px; font-size: 12px; max-width: 60vw; white-space: pre-wrap;
}

/* ── loading ── */
#loading {
  position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #2f9be8 0%, #7fd4ff 55%, #ffe9a8 100%);
  transition: opacity 0.6s;
}
#loading.hide { opacity: 0; pointer-events: none; }
.loadBox { text-align: center; }
.loadFlag { font-size: 84px; animation: wave 1s infinite ease-in-out; filter: drop-shadow(0 6px 0 rgba(0,0,0,0.15)); }
@keyframes wave { 50% { transform: rotate(-8deg) scale(1.08); } }
.loadTitle {
  font-size: clamp(34px, 6vw, 60px); font-weight: 700; line-height: 1.02; margin: 8px 0 20px;
  color: #fff; text-shadow: 0 4px 0 #1d5fa8, 0 8px 14px rgba(0, 0, 0, 0.25); letter-spacing: 2px;
}
.loadBar { width: 240px; height: 14px; margin: 0 auto; background: rgba(255,255,255,0.4); border-radius: 99px; overflow: hidden; border: 2px solid rgba(255,255,255,0.8); }
.loadBar div { height: 100%; width: 40%; background: #ffd23f; border-radius: 99px; animation: load 0.9s infinite ease-in-out; }
@keyframes load { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
.loadTip { margin-top: 14px; font-weight: 600; color: #156; opacity: 0.85; }

/* ── generic round / chips ── */
.roundBtn {
  width: 46px; height: 46px; border-radius: 50%; font-size: 20px;
  background: linear-gradient(180deg, #ffffff, #d7e6f5); color: #1d3557;
  box-shadow: 0 4px 0 #9db4c8, 0 6px 10px rgba(0,0,0,0.25);
  display: flex; align-items: center; justify-content: center;
}
.roundBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #9db4c8; }

/* ══════════ HUD ══════════ */
#hud { position: fixed; inset: 0; z-index: 50; pointer-events: none; display: none; }
#hud.on { display: block; }
#hud button { pointer-events: auto; }

.hudTL { position: absolute; top: 10px; left: 10px; display: flex; gap: 8px; flex-wrap: wrap; max-width: 70vw; }
.hudChip {
  background: linear-gradient(180deg, #2d6cdf, #1d4fb8);
  border: 3px solid #fff; border-radius: 16px; padding: 4px 14px 5px;
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 4px 0 rgba(0,0,0,0.3);
}
.hudChip .lbl { font-size: 11px; font-weight: 700; opacity: 0.85; letter-spacing: 1px; }
.hudChip b { font-size: 24px; font-weight: 700; text-shadow: 0 2px 0 rgba(0,0,0,0.35); }
.hudChip.slim b { font-size: 18px; }
.hudChip.gold { background: linear-gradient(180deg, #e8961d, #c97412); }
.hudChip.place { background: linear-gradient(180deg, #7c3aed, #5b21b6); }

.bump { animation: bump 0.35s ease; }
@keyframes bump { 30% { transform: scale(1.35); } }

#progbar {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px; width: min(44vw, 520px);
}
#progbar .flagL, #progbar .flagR { font-size: 22px; filter: drop-shadow(0 2px 1px rgba(0,0,0,0.4)); }
#progbar .track {
  flex: 1; height: 10px; border-radius: 99px; position: relative;
  background: linear-gradient(180deg, #9db4c8, #5b7a99);
  border: 2px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,0.3);
}
#progMarkers { position: absolute; inset: 0; }
.pmarker { position: absolute; top: -13px; font-size: 18px; transform: translateX(-50%); transition: left 0.2s linear; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5)); }
.pmarker.me { font-size: 22px; top: -16px; z-index: 2; }

#btnPauseTop { position: absolute; top: 10px; right: 10px; }

.mapWrap {
  position: absolute; right: 10px; top: 64px;
  background: radial-gradient(circle at 40% 35%, rgba(56, 140, 220, 0.85), rgba(16, 60, 120, 0.9));
  border: 3px solid #fff; border-radius: 50%; padding: 2px;
  box-shadow: 0 4px 0 rgba(0,0,0,0.3);
}
#minimap { display: block; border-radius: 50%; }

.powerSlot {
  position: absolute; right: 16px; bottom: 116px;
  width: 76px; height: 76px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #3d414f, #14161d);
  border: 4px solid #fff; box-shadow: 0 5px 0 rgba(0,0,0,0.35);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: auto !important;
}
.powerSlot.has { background: radial-gradient(circle at 40% 35%, #7c3aed, #3b1472); animation: pulse 0.8s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.25), 0 5px 0 rgba(0,0,0,0.35); } }
#hudPower { font-size: 34px; line-height: 1; }
.keyHint { font-size: 9px; font-weight: 700; letter-spacing: 1px; opacity: 0.75; margin-top: 2px; }

#speedo {
  position: absolute; right: 18px; bottom: 40px;
  background: linear-gradient(180deg, #2d6cdf, #1d4fb8);
  border: 3px solid #fff; border-radius: 18px; padding: 6px 16px;
  text-align: center; box-shadow: 0 4px 0 rgba(0,0,0,0.3);
}
#speedo b { font-size: 32px; display: block; line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,0.35); }
#speedo span { font-size: 11px; font-weight: 700; opacity: 0.8; letter-spacing: 2px; }

#banner {
  position: absolute; top: 32%; left: 50%; transform: translate(-50%, -50%);
  font-size: clamp(64px, 14vw, 150px); font-weight: 700; color: #fff;
  text-shadow: 0 6px 0 #1d5fa8, 0 12px 24px rgba(0,0,0,0.4);
  pointer-events: none; white-space: nowrap;
}
#banner.small { font-size: clamp(34px, 7vw, 70px); text-shadow: 0 4px 0 #1d5fa8, 0 8px 16px rgba(0,0,0,0.4); }
#banner.pop { animation: popin 0.5s ease; }
@keyframes popin { 0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; } 60% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); } }

/* touch */
#touchWrap { display: none; }
#touchWrap.on { display: block; }
.tcol { position: absolute; bottom: 26px; display: flex; gap: 14px; }
.tcol.left { left: 16px; }
.tcol.right { right: 112px; }
.tbtn {
  width: 84px; height: 84px; border-radius: 50%; font-size: 30px; color: #fff;
  background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.35), rgba(255,255,255,0.12));
  border: 3px solid rgba(255,255,255,0.9); backdrop-filter: blur(2px);
}
.tbtn.brake { background: radial-gradient(circle at 40% 35%, rgba(255,120,80,0.6), rgba(180,40,20,0.4)); }
.tbtn.held { transform: scale(0.92); background: radial-gradient(circle at 40% 35%, rgba(255,220,90,0.7), rgba(200,150,20,0.5)); }

/* speed lines */
#speedLines { position: fixed; inset: 0; z-index: 40; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
#speedLines.on { opacity: 1; }
#speedLines::before {
  content: ''; position: absolute; inset: -10%;
  background: repeating-conic-gradient(from 0deg, transparent 0deg 9deg, rgba(255,255,255,0.16) 9deg 11deg);
  animation: spinS 0.4s linear infinite;
  mask: radial-gradient(circle, transparent 42%, black 78%);
  -webkit-mask: radial-gradient(circle, transparent 42%, black 78%);
}
@keyframes spinS { 100% { transform: rotate(8deg); } }

.coinPop {
  position: fixed; z-index: 60; font-size: 20px; font-weight: 700; color: #ffd23f;
  text-shadow: 0 2px 0 #7c4a03; pointer-events: none;
  animation: coinUp 1s ease-out forwards;
}
@keyframes coinUp { 0% { transform: translateY(0) scale(0.6); opacity: 0; } 20% { opacity: 1; transform: translateY(-14px) scale(1.2);} 100% { transform: translateY(-70px) scale(1); opacity: 0; } }

/* ══════════ GARAGE UI ══════════ */
#garageUI { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; pointer-events: none; }
#garageUI.on { display: flex; }
#garageUI button { pointer-events: auto; }

#topbar {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  background: linear-gradient(180deg, rgba(13, 42, 84, 0.75), rgba(13, 42, 84, 0.0));
}
.stat {
  display: flex; align-items: center; gap: 7px; font-size: 18px; font-weight: 700;
  background: linear-gradient(180deg, #2d6cdf, #1d4fb8);
  border: 3px solid #fff; border-radius: 99px; padding: 5px 16px 5px 10px;
  box-shadow: 0 4px 0 rgba(0,0,0,0.3);
}
.stat.coin { background: linear-gradient(180deg, #e8961d, #c97412); }
.stat.gem { background: linear-gradient(180deg, #c44de0, #8b2cb8); }
.stat span { font-size: 20px; }
#topbar .spacer { flex: 1; }
.miniBtn {
  width: 44px; height: 44px; border-radius: 14px; font-size: 19px;
  background: linear-gradient(180deg, #ffffff, #d7e6f5);
  box-shadow: 0 4px 0 #9db4c8, 0 6px 10px rgba(0,0,0,0.25);
}
.miniBtn.off { opacity: 0.55; filter: grayscale(1); }
.miniBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #9db4c8; }

#logo {
  position: absolute; top: 66px; left: 14px; font-size: clamp(20px, 3vw, 30px); font-weight: 700;
  color: #ffe95e; text-shadow: 0 3px 0 #b45309, 0 6px 12px rgba(0,0,0,0.4); letter-spacing: 1px;
  transform: rotate(-2deg);
}
#logo span { color: #fff; }

#carNamePlate {
  position: absolute; bottom: 118px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 600; background: rgba(13, 42, 84, 0.72);
  border: 2px solid rgba(255,255,255,0.5); border-radius: 99px; padding: 6px 22px;
  backdrop-filter: blur(3px); white-space: nowrap;
}

#menuBar {
  position: absolute; bottom: 0; left: 0; right: 0;
  display: flex; align-items: flex-end; justify-content: center; gap: 10px;
  padding: 14px 10px 18px; flex-wrap: wrap;
  background: linear-gradient(0deg, rgba(13, 42, 84, 0.85), rgba(13, 42, 84, 0.0));
}
.mbtn {
  border-radius: 20px; font-weight: 700; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.3);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 3px solid #fff; box-shadow: 0 6px 0 rgba(0,0,0,0.3), 0 10px 16px rgba(0,0,0,0.25);
  transition: transform 0.08s;
}
.mbtn:active { transform: translateY(4px); }
.mbtn.small {
  width: 88px; height: 74px; font-size: 24px;
  background: linear-gradient(180deg, #38bdf8, #0284c7);
}
.mbtn.small span { font-size: 12px; letter-spacing: 0.5px; }
.mbtn.race {
  width: 150px; height: 92px; font-size: 34px;
  background: linear-gradient(180deg, #22c55e, #15803d);
  animation: racePulse 1.6s infinite ease-in-out;
}
.mbtn.race span { font-size: 22px; letter-spacing: 2px; }
@keyframes racePulse { 50% { transform: scale(1.06); filter: brightness(1.12); } }

/* ══════════ Panel (shop etc.) ══════════ */
#panel {
  position: fixed; inset: 0; z-index: 80; display: none;
  background: rgba(5, 20, 45, 0.6); backdrop-filter: blur(3px);
  align-items: center; justify-content: center; padding: 2vh 2vw;
}
#panel.open { display: flex; }
.panelBox {
  width: min(1060px, 96vw); height: min(660px, 92vh);
  background: linear-gradient(180deg, #1e5aa8, #10386e);
  border: 4px solid #fff; border-radius: 26px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  display: flex; flex-direction: column; overflow: hidden;
}
.panelHead {
  display: flex; align-items: center; gap: 14px; padding: 12px 16px;
  background: rgba(255,255,255,0.1); border-bottom: 3px solid rgba(255,255,255,0.25);
}
.panelHead h2 { font-size: 26px; text-shadow: 0 3px 0 rgba(0,0,0,0.3); letter-spacing: 1px; }
#panelTabs { display: flex; gap: 8px; flex: 1; }
.tab {
  padding: 8px 18px; border-radius: 99px; font-weight: 700; font-size: 15px;
  background: rgba(255,255,255,0.15); color: #cfe3ff; border: 2px solid transparent;
}
.tab.on { background: #ffd23f; color: #4a2c00; border-color: #fff; }
#panelBody { flex: 1; overflow-y: auto; padding: 14px; scrollbar-width: thin; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card {
  background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.07));
  border: 3px solid rgba(255,255,255,0.35); border-radius: 18px; padding: 10px;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  transition: transform 0.12s;
}
.card:hover { transform: translateY(-3px); }
.card.sel { border-color: #ffd23f; box-shadow: 0 0 0 3px rgba(255, 210, 63, 0.45), 0 8px 18px rgba(0,0,0,0.3); background: linear-gradient(180deg, rgba(255,210,63,0.22), rgba(255,255,255,0.08)); }
.card .thumb { width: 100%; height: 74px; border-radius: 12px; background: linear-gradient(180deg, #9fdcff, #d8f1ff 60%, #caa96a 60%); }
.card.driver .thumb { width: 84px; height: 84px; background: none; }
.card.driver .thumb.round { border-radius: 50%; }
.cname { font-weight: 700; font-size: 16px; text-shadow: 0 2px 0 rgba(0,0,0,0.3); }
.carch { font-size: 11px; font-weight: 600; opacity: 0.8; letter-spacing: 1px; margin-top: -4px; }
.stats { width: 100%; display: flex; flex-direction: column; gap: 3px; margin: 2px 0 4px; }
.srow { display: flex; align-items: center; gap: 6px; font-size: 9px; font-weight: 700; letter-spacing: 1px; opacity: 0.95; }
.sbar { flex: 1; height: 7px; border-radius: 99px; background: rgba(0,0,0,0.35); overflow: hidden; }
.sbar div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ffd23f, #fb923c); }
.cbtn {
  width: 100%; padding: 8px 4px; border-radius: 12px; font-weight: 700; font-size: 13px;
  border: 2px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,0.3); letter-spacing: 0.4px;
}
.cbtn:active { transform: translateY(2px); }
.cbtn.coins { background: linear-gradient(180deg, #f5c542, #d97706); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,0.35); }
.cbtn.gems { background: linear-gradient(180deg, #d66ae8, #9333ea); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,0.35); }
.cbtn.owned { background: linear-gradient(180deg, #38bdf8, #0284c7); color: #fff; }
.cbtn:disabled { background: linear-gradient(180deg, #22c55e, #15803d); cursor: default; }

/* customize */
.custTitle { font-size: 18px; font-weight: 700; margin: 10px 2px 10px; text-shadow: 0 2px 0 rgba(0,0,0,0.3); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 10px; margin-bottom: 8px; }
.sw {
  aspect-ratio: 1; border-radius: 16px; border: 3px solid rgba(255,255,255,0.7);
  box-shadow: 0 4px 0 rgba(0,0,0,0.3); font-size: 18px; font-weight: 800; color: #fff;
  display: flex; align-items: center; justify-content: center;
}
.sw.sel { outline: 4px solid #ffd23f; }
.sw i { font-size: 10px; background: rgba(0,0,0,0.55); padding: 2px 6px; border-radius: 8px; font-style: normal; }
.horns { display: flex; flex-direction: column; gap: 8px; max-width: 420px; }
.horn {
  text-align: left; padding: 12px 18px; border-radius: 14px; font-weight: 700; font-size: 16px;
  background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.4);
}
.horn.sel { background: #ffd23f; color: #4a2c00; border-color: #fff; }
.horn i { float: right; font-style: normal; opacity: 0.85; }
.hint { margin-top: 14px; font-size: 13px; opacity: 0.8; line-height: 1.5; }

/* upgrades */
.upgRow {
  background: rgba(255,255,255,0.1); border-radius: 18px; padding: 14px 16px; margin-bottom: 12px;
  display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center;
}
.upgHead { font-size: 17px; font-weight: 700; }
.upgBonus { font-size: 13px; color: #86efac; margin-left: 6px; }
.pips { display: flex; gap: 6px; }
.pip { width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.4); }
.pip.on { background: #ffd23f; border-color: #fff; box-shadow: 0 0 8px rgba(255, 210, 63, 0.8); }
.upgRow .cbtn { width: auto; padding: 10px 18px; }

/* series table */
.stable { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
.stable td { background: rgba(255,255,255,0.12); padding: 12px 18px; font-size: 17px; }
.stable tr.me td { background: rgba(255, 210, 63, 0.3); }
.stable td:first-child { border-radius: 14px 0 0 14px; font-size: 22px; width: 60px; }
.stable td:last-child { border-radius: 0 14px 14px 0; text-align: right; }

.help p { margin-bottom: 14px; font-size: 15.5px; line-height: 1.55; }
.help kbd {
  background: rgba(255,255,255,0.2); border-radius: 6px; padding: 2px 8px; font-family: inherit;
  border: 1px solid rgba(255,255,255,0.45); font-weight: 700;
}

/* ══════════ Modals ══════════ */
#results, #seasonModal, #pauseModal {
  position: fixed; inset: 0; z-index: 90; display: none;
  background: rgba(5, 20, 45, 0.55); backdrop-filter: blur(2px);
  align-items: center; justify-content: center;
}
#results.open, #seasonModal.open, #pauseModal.open { display: flex; }
.modalBox {
  width: min(480px, 94vw); max-height: 92vh; overflow-y: auto;
  background: linear-gradient(180deg, #1e5aa8, #10386e);
  border: 4px solid #fff; border-radius: 26px; padding: 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  animation: modalIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-align: center;
}
@keyframes modalIn { 0% { transform: scale(0.6) translateY(60px); opacity: 0; } }
.rtitle { font-size: 34px; font-weight: 700; text-shadow: 0 4px 0 rgba(0,0,0,0.3); }
.rtitle.win { color: #ffd23f; }
.rtitle.pod { color: #86efac; }
.rmap { font-size: 14px; opacity: 0.85; margin: 4px 0 14px; font-weight: 600; }
.rrows { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.rrow {
  display: grid; grid-template-columns: 44px 34px 1fr auto; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.12); border-radius: 12px; padding: 7px 14px; text-align: left;
}
.rrow.me { background: rgba(255, 210, 63, 0.35); border: 2px solid #ffd23f; }
.rmedal { font-size: 20px; }
.remoji { font-size: 20px; }
.rname { font-weight: 700; }
.rpts { font-weight: 600; opacity: 0.9; font-size: 14px; }
.rewards { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.rew {
  display: flex; align-items: center; gap: 6px; font-size: 20px;
  background: rgba(0,0,0,0.25); border-radius: 12px; padding: 8px 16px;
}
.rew span { font-size: 24px; }
.rew.sub { font-size: 13px; opacity: 0.85; }
.rbtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.big {
  padding: 14px 26px; border-radius: 18px; font-size: 18px; font-weight: 700; letter-spacing: 1px;
  border: 3px solid #fff; box-shadow: 0 5px 0 rgba(0,0,0,0.3);
}
.big.race { background: linear-gradient(180deg, #22c55e, #15803d); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.3); }
.big.ghost { background: rgba(255,255,255,0.14); color: #fff; }
.big:active { transform: translateY(3px); }

/* toast */
#toast {
  position: fixed; top: 74px; left: 50%; transform: translate(-50%, -30px); z-index: 95;
  background: linear-gradient(180deg, #ffffff, #dbeafe); color: #1d3557; font-weight: 700; font-size: 16px;
  padding: 10px 22px; border-radius: 99px; border: 3px solid #1d5fa8;
  box-shadow: 0 8px 20px rgba(0,0,0,0.35); opacity: 0; pointer-events: none;
  transition: opacity 0.25s, transform 0.25s; max-width: 90vw; text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.warn { background: linear-gradient(180deg, #fee2e2, #fecaca); border-color: #dc2626; color: #7f1d1d; }

/* confetti */
#confetti { position: fixed; inset: 0; z-index: 94; pointer-events: none; overflow: hidden; }
#confetti span { position: absolute; top: -60px; animation: fall 4.4s linear forwards; }
@keyframes fall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(340deg); opacity: 0.6; }
}

/* responsive */
@media (max-width: 700px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
  .hudChip b { font-size: 18px; }
  #progbar { width: 52vw; }
  .mbtn.small { width: 74px; height: 64px; font-size: 20px; }
  .mbtn.race { width: 128px; height: 80px; }
  #carNamePlate { bottom: 100px; font-size: 14px; }
  .powerSlot { bottom: 128px; width: 66px; height: 66px; }
  #hudPower { font-size: 28px; }
}

</style>

  for (int i = 0; i < 5; i++) {

    h += a * sin(f);
    grad += d * (a * k * cos(f));
